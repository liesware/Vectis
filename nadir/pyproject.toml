[project]
name = "nadir"
version = "0.1.0"
description = "Generic HTTP workflow and invariant fuzzer"
requires-python = ">=3.11"
dependencies = [
  "httpx==0.28.1",
  "pyyaml>=6.0.3",
]

[project.scripts]
nadir = "nadir.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

