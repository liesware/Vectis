# Nadir fuzz targets for the Vectis project.
#
# Request shape and mutations are pure data. Generic outcomes (status class,
# json_error, no leaked secret) are built in; a deep cryptographic property is
# named under `invariant:` and resolved to a Python function in project.py.
project: vectis

targets:

  # --- Shallow: authorization fuzzing, zero Python -----------------------------
  # Key properties are permission-protected. The thing under test is the API
  # key: valid credentials receive properties; empty/wrong/malformed keys are
  # rejected (401/403) and must never leak a declared secret.
  - name: vectis.keys
    request: {method: GET, path: "/keys/properties/{kid}", auth: true}
    mutate:
      - {variable: api_key, values: ["", "0000000000000000000000000000000000000000", "not-a-real-key", "wrong-but-plausible"], name: authn-invalid}
      - {variable: api_key, from_variable: denied_api_key, name: authz-denied, expected_status: 403}
    expect:
      control: {status: [200]}
      mutated: {authorization_matrix: true, json_error: true}

  # --- Shallow: path-variable fuzzing, one named shape invariant ---------------
  - name: vectis.public-keys
    request: {method: GET, path: "/pub/{kid}"}
    mutate:
      - variable: kid
        values: ["not-hex", "abcd", "ffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffff", "GGGGGGGG", "../keys"]
    expect:
      control: {status: [200], invariant: public_keys_output}
      mutated: {status: "4xx", json_error: true}

  # --- Deep: producer -> consumer, semantic invariant by name ------------------
  # Sign a control message, capture the compact signature, then verify a version
  # with one mutated segment. The request and the mutations are pure YAML; the
  # only Python is `verification_failure`, which asserts the hybrid per-segment
  # verification status. That irreducible bit is exactly Nadir's value.
  - name: vectis.sign-verification
    producer:
      method: POST
      path: "/sign/{kid}"
      auth: true
      replayable: false
      body: {message_hash: {alg: "SHA-256", hex: "{digest}"}}
    capture: {signer_kid: $.kid, signature: $.signature}
    consumer:
      method: POST
      path: /sign/verification
      body: {kid: "{signer_kid}", signature: "{signature}"}
    mutate:
      - json_field: $.signature
        delimiter: "."
        segments: [0, 1, 2, 3]
        name: compact-segment          # invariant keys on this name
    producer_expect: {status: [200], invariant: compact_signature_output}
    expect:
      control: {status: [200], invariant: verification_success}
      mutated: {status: [200], invariant: verification_failure}

  # --- Internal message AEAD --------------------------------------------------
  # The shallow target exercises the encrypt surface under every generic input
  # class. Its control response must be an opaque envelope: the plaintext cannot
  # appear in any serialized response field or response header.
  - name: vectis.internal-encrypt
    request:
      method: POST
      path: "/message/internal/encrypt/{kid}"
      auth: true
      body: {plaintext: "{internal_message_plaintext}"}
    mutate:
      - {json_field: $.plaintext, name: internal-plaintext}
    expect:
      control: {status: [200], invariant: internal_message_encrypt_output}
      mutated: {no_server_error: true}

  # A fresh authenticated envelope is produced for every mutation. AEAD binds
  # ciphertext, nonce, AAD, and variant, so each independent alteration must be
  # rejected; no generic input classes run here because encrypt covers them.
  - name: vectis.internal-message-round-trip
    generative: false
    producer:
      method: POST
      path: "/message/internal/encrypt/{kid}"
      auth: true
      replayable: false
      body: {plaintext: "{internal_message_plaintext}"}
    capture:
      internal_timestamp: $.timestamp
      internal_kid: $.kid
      internal_ctx: $.message.ctx
      internal_nonce: $.message.nonce
      internal_aad: $.message.aad
      internal_variant: $.message.variant
    consumer:
      method: POST
      path: /message/internal/decrypt
      auth: true
      body:
        {timestamp: "{internal_timestamp}", kid: "{internal_kid}", message: {ctx: "{internal_ctx}", nonce: "{internal_nonce}", aad: "{internal_aad}", variant: "{internal_variant}"}}
    mutate:
      - {json_field: $.message.ctx, name: internal-ctx, alphabet: "0123456789abcdef"}
      - {json_field: $.message.nonce, name: internal-nonce, alphabet: "0123456789abcdef"}
      - {json_field: $.message.aad, name: internal-aad}
      - {json_field: $.message.variant, name: internal-variant}
    producer_expect: {status: [200], invariant: internal_message_encrypt_output}
    expect:
      control: {status: [200], invariant: internal_message_round_trip}
      mutated: {status: "4xx", json_error: true, invariant: internal_message_tamper_rejected}

  # --- Deep: deterministic FPE encrypt -> decrypt -----------------------------
  # FF1 does not authenticate ciphertext. The semantic mutation changes the
  # signed profile selector instead, which must fail rather than silently using
  # a different domain. The control asserts the original plaintext round-trips.
  - name: vectis.fpe-round-trip
    producer:
      method: POST
      path: "/fpe/encrypt/{kid}"
      auth: true
      replayable: false
      body: {ref: "{fpe_ref}", profile: "{fpe_profile}", plaintext: "{fpe_plaintext}"}
    capture: {fpe_kid: $.kid, ciphertext: $.ciphertext}
    consumer:
      method: POST
      path: /fpe/decrypt
      auth: true
      body: {ref: "{fpe_ref}", kid: "{fpe_kid}", profile: "{fpe_profile}", ciphertext: "{ciphertext}"}
    mutate:
      - {json_field: $.profile, name: fpe-profile}
    producer_expect: {status: [200], invariant: fpe_encrypt_output}
    expect:
      control: {status: [200], invariant: fpe_round_trip}
      mutated: {status: "4xx", json_error: true}

  # --- Deep: FPE ciphertext tamper (FF1 is unauthenticated) --------------------
  # The profile target above cannot cover the real FF1 risk: a corrupted
  # ciphertext is not required to error, so it needs its own oracle. Tamper one
  # byte of the captured ciphertext; the decrypt must not crash (no_server_error)
  # and must never round-trip back to the original plaintext.
  - name: vectis.fpe-ciphertext
    producer:
      method: POST
      path: "/fpe/encrypt/{kid}"
      auth: true
      replayable: false
      body: {ref: "{fpe_ref}", profile: "{fpe_profile}", plaintext: "{fpe_plaintext}"}
    capture: {fpe_kid: $.kid, ciphertext: $.ciphertext}
    consumer:
      method: POST
      path: /fpe/decrypt
      auth: true
      body: {ref: "{fpe_ref}", kid: "{fpe_kid}", profile: "{fpe_profile}", ciphertext: "{ciphertext}"}
    mutate:
      # FF1 is format-preserving over the numeric domain: tamper within the digit
      # alphabet so the decrypt actually runs (a non-digit char would be rejected at
      # input validation, testing parsing instead of ciphertext integrity).
      - {json_field: $.ciphertext, name: fpe-ciphertext, alphabet: "0123456789"}
    producer_expect: {status: [200], invariant: fpe_encrypt_output}
    expect:
      control: {status: [200], invariant: fpe_round_trip}
      mutated: {no_server_error: true, no_server_crash: true, invariant: fpe_ciphertext_integrity}

  # --- Deep: MAC create -> verify ----------------------------------------------
  - name: vectis.mac-verification
    producer:
      method: POST
      path: "/mac/{kid}"
      auth: true
      replayable: false
      body: {ref: "{mac_ref}", profile: "{mac_profile}", plaintext: "{mac_plaintext}"}
    capture: {mac_kid: $.kid, digest: $.digest}
    consumer:
      method: POST
      path: /mac/verify
      auth: true
      body: {ref: "{mac_ref}", kid: "{mac_kid}", profile: "{mac_profile}", plaintext: "{mac_plaintext}", digest: "{digest}"}
    mutate:
      # Hex is case-insensitive, so a bare case flip decodes to the same bytes and a
      # correct verifier still accepts it (false positive). Flip within the hex
      # alphabet so the digest is a genuinely different value.
      - {json_field: $.digest, name: mac-digest, alphabet: "0123456789abcdef"}
      - {json_field: $.plaintext, name: mac-plaintext}
    producer_expect: {status: [200], invariant: mac_create_output}
    expect:
      control: {status: [200], invariant: mac_verification_success}
      mutated: {status: [200], invariant: mac_verification_failure}

  # --- Blind indexes: persisted deterministic membership ----------------------
  # Indexes deliberately reuse the MAC profile. This shallow surface target
  # exercises malformed JSON against creation while ensuring a response never
  # reflects its input plaintext.
  - name: vectis.blind-index-create
    request:
      method: POST
      path: "/index/{kid}"
      auth: true
      body: {ref: "{index_ref}", profile: "{index_profile}", plaintext: "{index_plaintext}"}
    mutate:
      - {json_field: $.plaintext, name: blind-index-plaintext}
    expect:
      control: {status: [200], invariant: blind_index_create_output}
      mutated: {no_server_error: true}

  # Freshly persist a single digest, then distinguish membership from a valid
  # different plaintext. A false match is a contract failure, not an HTTP error.
  - name: vectis.blind-index-membership
    generative: false
    producer:
      method: POST
      path: "/index/{kid}"
      auth: true
      replayable: false
      body: {ref: "{index_ref}", profile: "{index_profile}", plaintext: "{index_plaintext}"}
    capture: {index_kid: $.kid, index_digest: $.index}
    consumer:
      method: POST
      path: /index/verify
      auth: true
      body: {ref: "{index_ref}", kid: "{index_kid}", profile: "{index_profile}", plaintext: "{index_plaintext}"}
    mutate:
      - {variable: index_plaintext, from_variable: index_mutated_plaintext, name: blind-index-plaintext}
    producer_expect: {status: [200], invariant: blind_index_create_output}
    expect:
      control: {status: [200], invariant: blind_index_membership}
      mutated: {status: [200], invariant: blind_index_nonmembership}

  # Batch create and verify preserve item order and bind each digest to its own
  # plaintext. Mutate only item one, so the expected result is [true, false].
  - name: vectis.blind-index-batch-membership
    generative: false
    flow:
      - step: create-batch
        request:
          method: POST
          path: "/index/batch/{kid}"
          auth: true
          replayable: false
          body:
            {profile: "{index_profile}", items: [{ref: "{index_batch_ref_zero}", plaintext: "{index_batch_plaintext_zero}"}, {ref: "{index_batch_ref_one}", plaintext: "{index_batch_plaintext_one}"}]}
        capture: {index_batch_kid: $.kid, index_batch_zero: $.items.0.index, index_batch_one: $.items.1.index}
        expect: {status: [200]}
      - step: verify-batch
        request:
          method: POST
          path: /index/verify/batch
          auth: true
          body:
            {kid: "{index_batch_kid}", profile: "{index_profile}", items: [{ref: "{index_batch_ref_zero}", plaintext: "{index_batch_plaintext_zero}"}, {ref: "{index_batch_ref_one}", plaintext: "{index_batch_plaintext_one}"}]}
        fuzz: true
        mutate:
          - {variable: index_batch_plaintext_one, from_variable: index_mutated_plaintext, name: blind-index-batch-plaintext}
        expect: {status: [200], invariant: blind_index_batch_membership}
        fuzz_expect: {status: [200], invariant: blind_index_batch_nonmembership}

  # Duplicate refs make the create batch invalid. The following independent
  # verify proves the entire batch rolled back instead of persisting item zero.
  - name: vectis.blind-index-batch-atomicity
    control: false
    generative: false
    flow:
      - step: rejected-create-batch
        request:
          method: POST
          path: "/index/batch/{kid}"
          auth: true
          replayable: false
          body:
            {profile: "{index_profile}", items: [{ref: "{index_atomic_ref_zero}", plaintext: "{index_atomic_plaintext_zero}"}, {ref: "{index_atomic_ref_one}", plaintext: "{index_atomic_plaintext_one}"}]}
        fuzz: true
        mutate:
          - {variable: index_atomic_ref_one, from_variable: index_atomic_ref_zero, name: blind-index-batch-duplicate-ref}
        expect: {status: [200]}
        fuzz_expect: {status: "4xx", json_error: true, forbidden_json_fields: [items]}
        continue_on_rejection: true
      - step: verify-no-partial-write
        request:
          method: POST
          path: /index/verify/batch
          auth: true
          body:
            {kid: "{kid}", profile: "{index_profile}", items: [{ref: "{index_atomic_ref_zero}", plaintext: "{index_atomic_plaintext_zero}"}, {ref: "{index_atomic_ref_one}", plaintext: "{index_atomic_plaintext_one}"}]}
        expect: {status: [200], invariant: blind_index_batch_atomicity}

  # --- Cryptographic commitments: stateless, randomized openings -------------
  - name: vectis.commitment-create
    request:
      method: POST
      path: "/commit/{kid}"
      auth: true
      body: {ref: "{commit_ref}", profile: "{commit_profile}", plaintext: "{commit_plaintext}"}
    mutate:
      - {json_field: $.plaintext, name: commitment-plaintext}
    requires: [commit_opening_len]
    expect:
      control: {status: [200], invariant: commitment_create_output}
      mutated: {no_server_error: true}

  # The producer makes a fresh commitment; all consumer mutations remain well
  # formed, so Vectis must return valid:false instead of merely rejecting shape.
  - name: vectis.commitment-round-trip
    generative: false
    artifact_redact_captures: [commit_opening]
    producer:
      method: POST
      path: "/commit/{kid}"
      auth: true
      replayable: false
      body: {ref: "{commit_ref}", profile: "{commit_profile}", plaintext: "{commit_plaintext}"}
    capture: {commit_kid: $.kid, commit_value: $.commitment, commit_opening: $.opening}
    consumer:
      method: POST
      path: /commit/verify
      auth: true
      body: {ref: "{commit_ref}", kid: "{commit_kid}", profile: "{commit_profile}", plaintext: "{commit_plaintext}", opening: "{commit_opening}", commitment: "{commit_value}"}
    mutate:
      - {variable: commit_plaintext, from_variable: commit_mutated_plaintext, name: commitment-plaintext}
      - {json_field: $.opening, name: commitment-opening, alphabet: "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789_-"}
      - {json_field: $.commitment, name: commitment-digest, alphabet: "0123456789abcdef"}
    requires: [commit_opening_len]
    producer_expect: {status: [200], invariant: commitment_create_output}
    expect:
      control: {status: [200], invariant: commitment_verification_success}
      mutated: {status: [200], invariant: commitment_verification_failure}

  # Creating the same plaintext twice must produce independent opening and
  # commitment values. A ref-only mutation keeps that property stable per run.
  - name: vectis.commitment-randomness
    generative: false
    artifact_redact_captures: [first_opening, second_opening]
    flow:
      - step: create-first
        request:
          method: POST
          path: "/commit/{kid}"
          auth: true
          replayable: false
          body: {ref: "{commit_ref}", profile: "{commit_profile}", plaintext: "{commit_plaintext}"}
        capture: {first_commitment: $.commitment, first_opening: $.opening}
        expect: {status: [200], invariant: commitment_create_output}
      - step: create-second
        request:
          method: POST
          path: "/commit/{kid}"
          auth: true
          replayable: false
          body: {ref: "{commit_random_ref}", profile: "{commit_profile}", plaintext: "{commit_plaintext}"}
        capture: {second_opening: $.opening}
        fuzz: true
        mutate:
          - {json_field: $.ref, name: commitment-random-ref}
        expect: {status: [200], invariant: commitment_randomness}
        fuzz_expect: {status: [200], invariant: commitment_randomness}

  - name: vectis.commitment-batch-round-trip
    generative: false
    artifact_redact_captures: [commit_batch_opening_zero, commit_batch_opening_one]
    flow:
      - step: create-batch
        request:
          method: POST
          path: "/commit/batch/{kid}"
          auth: true
          replayable: false
          body:
            {profile: "{commit_profile}", items: [{ref: "{commit_batch_ref_zero}", plaintext: "{commit_batch_plaintext_zero}"}, {ref: "{commit_batch_ref_one}", plaintext: "{commit_batch_plaintext_one}"}]}
        capture:
          commit_batch_kid: $.kid
          commit_batch_value_zero: $.items.0.commitment
          commit_batch_opening_zero: $.items.0.opening
          commit_batch_value_one: $.items.1.commitment
          commit_batch_opening_one: $.items.1.opening
        expect: {status: [200], invariant: commitment_batch_create_output}
      - step: verify-batch
        request:
          method: POST
          path: /commit/verify/batch
          auth: true
          body:
            {kid: "{commit_batch_kid}", profile: "{commit_profile}", items: [{ref: "{commit_batch_ref_zero}", plaintext: "{commit_batch_plaintext_zero}", opening: "{commit_batch_opening_zero}", commitment: "{commit_batch_value_zero}"}, {ref: "{commit_batch_ref_one}", plaintext: "{commit_batch_plaintext_one}", opening: "{commit_batch_opening_one}", commitment: "{commit_batch_value_one}"}]}
        fuzz: true
        mutate:
          - {variable: commit_batch_plaintext_one, from_variable: commit_mutated_plaintext, name: commitment-batch-plaintext}
        expect: {status: [200], invariant: commitment_batch_verification_success}
        fuzz_expect: {status: [200], invariant: commitment_batch_verification_failure}

  # Commitments retain no state, so all-or-nothing here means invalid batch
  # input yields only a rejection, never a partial create response.
  - name: vectis.commitment-batch-validation
    generative: false
    request:
      method: POST
      path: "/commit/batch/{kid}"
      auth: true
      body:
        {profile: "{commit_profile}", items: [{ref: "{commit_batch_ref_zero}", plaintext: "{commit_batch_plaintext_zero}"}, {ref: "{commit_batch_ref_one}", plaintext: "{commit_batch_plaintext_one}"}]}
    mutate:
      - {variable: commit_batch_ref_one, from_variable: commit_batch_ref_zero, name: commitment-batch-duplicate-ref}
    requires: [commit_opening_len]
    expect:
      control: {status: [200], invariant: commitment_batch_create_output}
      mutated: {status: "4xx", json_error: true, forbidden_json_fields: [items]}

  - name: vectis.commitment-create-authorization
    generative: false
    request:
      method: POST
      path: "/commit/{kid}"
      auth: true
      body: {ref: "{commit_ref}", profile: "{commit_profile}", plaintext: "{commit_plaintext}"}
    mutate:
      - {variable: api_key, values: ["", not-a-real-key], name: authn-invalid}
      - {variable: api_key, from_variable: denied_api_key, name: authz-denied, expected_status: 403}
    requires: [commit_opening_len]
    expect:
      control: {status: [200], invariant: commitment_create_output}
      mutated: {authorization_matrix: true, json_error: true}

  - name: vectis.commitment-verify-authorization
    generative: false
    artifact_redact_captures: [commit_opening]
    producer:
      method: POST
      path: "/commit/{kid}"
      auth: true
      replayable: false
      body: {ref: "{commit_ref}", profile: "{commit_profile}", plaintext: "{commit_plaintext}"}
    capture: {commit_kid: $.kid, commit_value: $.commitment, commit_opening: $.opening}
    consumer:
      method: POST
      path: /commit/verify
      auth: true
      body: {ref: "{commit_ref}", kid: "{commit_kid}", profile: "{commit_profile}", plaintext: "{commit_plaintext}", opening: "{commit_opening}", commitment: "{commit_value}"}
    mutate:
      - {variable: api_key, values: ["", not-a-real-key], name: authn-invalid}
      - {variable: api_key, from_variable: denied_api_key, name: authz-denied, expected_status: 403}
    requires: [commit_opening_len]
    producer_expect: {status: [200], invariant: commitment_create_output}
    expect:
      control: {status: [200], invariant: commitment_verification_success}
      mutated: {authorization_matrix: true, json_error: true}

  # --- Secret sharing: stateless authenticated Shamir envelopes ---------------
  - name: vectis.share-split
    request:
      method: POST
      path: "/shares/split/{kid}"
      auth: true
      body: {profile: "{share_profile}", plaintext: "{share_plaintext}"}
    mutate:
      - {json_field: $.plaintext, name: share-plaintext}
    expect:
      control: {status: [200], invariant: sharing_split_output}
      mutated: {no_server_error: true}

  # Combine a nonconsecutive threshold subset. All captures are artifact-only
  # secrets, so an integrity finding cannot preserve reconstructing material.
  - name: vectis.share-round-trip
    generative: false
    artifact_redact_captures: [share_zero, share_one, share_two, share_three, share_four]
    producer:
      method: POST
      path: "/shares/split/{kid}"
      auth: true
      replayable: false
      body: {profile: "{share_profile}", plaintext: "{share_plaintext}"}
    capture:
      share_kid: $.kid
      share_set_id: $.set_id
      share_zero: $.shares.0
      share_one: $.shares.1
      share_two: $.shares.2
      share_three: $.shares.3
      share_four: $.shares.4
    consumer:
      method: POST
      path: /shares/combine
      auth: true
      body: {kid: "{share_kid}", profile: "{share_profile}", shares: ["{share_zero}", "{share_two}", "{share_four}"]}
    mutate:
      - {json_field: $.shares.2, delimiter: ".", segments: [-1], name: share-envelope}
      - {variable: share_four, from_variable: share_two, name: share-duplicate-index}
    producer_expect: {status: [200], invariant: sharing_split_output}
    expect:
      control: {status: [200], invariant: sharing_round_trip}
      mutated: {status: "4xx", json_error: true}

  # The control makes two fresh distributions of the same secret. A profile
  # mutation then keeps the fuzz path a normal input rejection.
  - name: vectis.share-randomness
    generative: false
    artifact_redact_captures: [first_share_zero, first_share_one, first_share_two, first_share_three, first_share_four, second_share_zero, second_share_one, second_share_two, second_share_three, second_share_four]
    flow:
      - step: first-split
        request:
          method: POST
          path: "/shares/split/{kid}"
          auth: true
          replayable: false
          body: {profile: "{share_profile}", plaintext: "{share_plaintext}"}
        capture:
          first_set_id: $.set_id
          first_share_zero: $.shares.0
          first_share_one: $.shares.1
          first_share_two: $.shares.2
          first_share_three: $.shares.3
          first_share_four: $.shares.4
        expect: {status: [200], invariant: sharing_split_output}
      - step: second-split
        request:
          method: POST
          path: "/shares/split/{kid}"
          auth: true
          replayable: false
          body: {profile: "{share_profile}", plaintext: "{share_plaintext}"}
        capture:
          second_set_id: $.set_id
          second_share_zero: $.shares.0
          second_share_one: $.shares.1
          second_share_two: $.shares.2
          second_share_three: $.shares.3
          second_share_four: $.shares.4
        fuzz: true
        mutate:
          - {json_field: $.profile, name: sharing-profile}
        expect: {status: [200], invariant: sharing_randomness}
        fuzz_expect: {status: "4xx", json_error: true}

  # A valid 3-share combine is the control. An altered envelope or repeated
  # index must never return reconstructed plaintext.
  - name: vectis.share-combine-integrity
    generative: false
    artifact_redact_captures: [share_zero, share_one, share_two]
    producer:
      method: POST
      path: "/shares/split/{kid}"
      auth: true
      replayable: false
      body: {profile: "{share_profile}", plaintext: "{share_plaintext}"}
    capture:
      share_kid: $.kid
      share_set_id: $.set_id
      share_zero: $.shares.0
      share_one: $.shares.1
      share_two: $.shares.2
    consumer:
      method: POST
      path: /shares/combine
      auth: true
      body: {kid: "{share_kid}", profile: "{share_profile}", shares: ["{share_zero}", "{share_one}", "{share_two}"]}
    mutate:
      - {json_field: $.shares.2, delimiter: ".", segments: [-1], name: share-envelope}
      - {variable: share_two, from_variable: share_one, name: share-duplicate-index}
    producer_expect: {status: [200], invariant: sharing_split_output}
    expect:
      control: {status: [200], invariant: sharing_round_trip}
      mutated: {status: "4xx", json_error: true}

  - name: vectis.share-threshold
    generative: false
    artifact_redact_captures: [share_zero, share_one]
    flow:
      - step: split
        request:
          method: POST
          path: "/shares/split/{kid}"
          auth: true
          replayable: false
          body: {profile: "{share_profile}", plaintext: "{share_plaintext}"}
        capture: {share_kid: $.kid, share_zero: $.shares.0, share_one: $.shares.1}
        expect: {status: [200], invariant: sharing_split_output}
      - step: below-threshold-combine
        request:
          method: POST
          path: /shares/combine
          auth: true
          body: {kid: "{share_kid}", profile: "{share_profile}", shares: ["{share_zero}", "{share_one}"]}
        fuzz: true
        mutate:
          - {json_field: $.profile, name: sharing-profile}
        expect: {status: "4xx", json_error: true}
        fuzz_expect: {status: "4xx", json_error: true}

  - name: vectis.share-cross-set
    generative: false
    artifact_redact_captures: [first_share_zero, first_share_one, first_share_two, second_share_zero]
    flow:
      - step: first-split
        request:
          method: POST
          path: "/shares/split/{kid}"
          auth: true
          replayable: false
          body: {profile: "{share_profile}", plaintext: "{share_plaintext}"}
        capture: {share_kid: $.kid, share_set_id: $.set_id, first_share_zero: $.shares.0, first_share_one: $.shares.1, first_share_two: $.shares.2}
        expect: {status: [200], invariant: sharing_split_output}
      - step: second-split
