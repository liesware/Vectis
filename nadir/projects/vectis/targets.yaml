  # Authorization is evaluated AFTER structural body validation on these routes, so
  # an empty body makes a denied credential fail with 400 (missing fields) before the
  # grant is ever checked, never reaching 403. Each probe therefore sends a
  # structurally complete batch body with synthetic values: a granted client reaches a
  # real handler (2xx, or 4xx when the synthetic material does not resolve — never an
  # auth error), an invalid credential is blocked at 401, and an ungranted one at 403
  # (authorization_matrix). Semantic material checks (token prefix, ciphertext, opening)
  # run at execution, after authorization, so synthetic values still reach the grant
  # check. The dedicated *-batch-validation targets cover all-or-nothing rejection.
  - name: vectis.fpe-batch-encrypt-authorization
    generative: false
    request: {method: POST, path: "/fpe/encrypt/batch/{kid}", auth: true, body: {profile: "{fpe_profile}", items: [{ref: "{fpe_ref}", plaintext: "{fpe_plaintext}"}]}}
    mutate: [{variable: api_key, values: ["", not-a-real-key], name: authn-invalid}, {variable: api_key, from_variable: denied_api_key, name: authz-denied, expected_status: 403}]
    expect: {control: {status: [200, 400, 404]}, mutated: {authorization_matrix: true, json_error: true}}
  - name: vectis.fpe-batch-decrypt-authorization
    generative: false
    request: {method: POST, path: /fpe/decrypt/batch, auth: true, body: {kid: "{kid}", profile: "{fpe_profile}", items: [{ref: "{fpe_ref}", ciphertext: "{fpe_plaintext}"}]}}
    mutate: [{variable: api_key, values: ["", not-a-real-key], name: authn-invalid}, {variable: api_key, from_variable: denied_api_key, name: authz-denied, expected_status: 403}]
    expect: {control: {status: [200, 400, 404]}, mutated: {authorization_matrix: true, json_error: true}}
