# Nadir fuzz targets for the Vectis project.
#
# Request shape and mutations are pure data. Generic outcomes (status class,
# json_error, no leaked secret) are built in; a deep cryptographic property is
# named under `invariant:` and resolved to a Python function in project.py.
project: vectis

targets:

  # --- Shallow: authorization fuzzing, zero Python -----------------------------
  # Key properties are permission-protected. The thing under test is the API
  # key: valid credentials receive properties; empty/wrong/malformed keys are
  # rejected (401/403) and must never leak a declared secret.
  - name: vectis.keys
    request: {method: GET, path: "/keys/properties/{kid}", auth: true}
    mutate:
      - {variable: api_key, values: ["", "0000000000000000000000000000000000000000", "not-a-real-key", "wrong-but-plausible"], name: authn-invalid}
      - {variable: api_key, from_variable: denied_api_key, name: authz-denied, expected_status: 403}
    expect:
      control: {status: [200]}
      mutated: {authorization_matrix: true, json_error: true}

  # --- Shallow: path-variable fuzzing, one named shape invariant ---------------
  - name: vectis.public-keys
    request: {method: GET, path: "/pub/{kid}"}
    mutate:
      - variable: kid
        values: ["not-hex", "abcd", "ffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffff", "GGGGGGGG", "../keys"]
    expect:
      control: {status: [200], invariant: public_keys_output}
      mutated: {status: "4xx", json_error: true}

  # --- Deep: producer -> consumer, semantic invariant by name ------------------
  # Sign a control message, capture the compact signature, then verify a version
  # with one mutated segment. The request and the mutations are pure YAML; the
  # only Python is `verification_failure`, which asserts the hybrid per-segment
  # verification status. That irreducible bit is exactly Nadir's value.
  - name: vectis.sign-verification
    producer:
      method: POST
      path: "/sign/{kid}"
      auth: true
      replayable: false
      body: {message_hash: {alg: "SHA-256", hex: "{digest}"}}
    capture: {signer_kid: $.kid, signature: $.signature}
    consumer:
      method: POST
      path: /sign/verification
      body: {kid: "{signer_kid}", signature: "{signature}"}
    mutate:
      - json_field: $.signature
        delimiter: "."
        segments: [0, 1, 2, 3]
        name: compact-segment          # invariant keys on this name
    producer_expect: {status: [200], invariant: compact_signature_output}
    expect:
      control: {status: [200], invariant: verification_success}
      mutated: {status: [200], invariant: verification_failure}

  # --- Internal message AEAD --------------------------------------------------
  # The shallow target exercises the encrypt surface under every generic input
  # class. Its control response must be an opaque envelope: the plaintext cannot
  # appear in any serialized response field or response header.
  - name: vectis.internal-encrypt
    request:
      method: POST
      path: "/message/internal/encrypt/{kid}"
      auth: true
      body: {plaintext: "{internal_message_plaintext}"}
    mutate:
      - {json_field: $.plaintext, name: internal-plaintext}
    expect:
      control: {status: [200], invariant: internal_message_encrypt_output}
      mutated: {no_server_error: true}

  # A fresh authenticated envelope is produced for every mutation. AEAD binds
  # ciphertext, nonce, AAD, and variant, so each independent alteration must be
  # rejected; no generic input classes run here because encrypt covers them.
  - name: vectis.internal-message-round-trip
    generative: false
    producer:
      method: POST
      path: "/message/internal/encrypt/{kid}"
      auth: true
      replayable: false
      body: {plaintext: "{internal_message_plaintext}"}
    capture:
      internal_timestamp: $.timestamp
      internal_kid: $.kid
      internal_ctx: $.message.ctx
      internal_nonce: $.message.nonce
      internal_aad: $.message.aad
      internal_variant: $.message.variant
    consumer:
      method: POST
      path: /message/internal/decrypt
      auth: true
      body:
        {timestamp: "{internal_timestamp}", kid: "{internal_kid}", message: {ctx: "{internal_ctx}", nonce: "{internal_nonce}", aad: "{internal_aad}", variant: "{internal_variant}"}}
    mutate:
      - {json_field: $.message.ctx, name: internal-ctx, alphabet: "0123456789abcdef"}
      - {json_field: $.message.nonce, name: internal-nonce, alphabet: "0123456789abcdef"}
      - {json_field: $.message.aad, name: internal-aad}
      - {json_field: $.message.variant, name: internal-variant}
    producer_expect: {status: [200], invariant: internal_message_encrypt_output}
    expect:
      control: {status: [200], invariant: internal_message_round_trip}
      mutated: {status: "4xx", json_error: true, invariant: internal_message_tamper_rejected}

  # --- Deep: deterministic FPE encrypt -> decrypt -----------------------------
  # FF1 does not authenticate ciphertext. The semantic mutation changes the
  # signed profile selector instead, which must fail rather than silently using
  # a different domain. The control asserts the original plaintext round-trips.
  - name: vectis.fpe-round-trip
    producer:
      method: POST
      path: "/fpe/encrypt/{kid}"
      auth: true
      replayable: false
      body: {ref: "{fpe_ref}", profile: "{fpe_profile}", plaintext: "{fpe_plaintext}"}
    capture: {fpe_kid: $.kid, ciphertext: $.ciphertext}
    consumer:
      method: POST
      path: /fpe/decrypt
      auth: true
      body: {ref: "{fpe_ref}", kid: "{fpe_kid}", profile: "{fpe_profile}", ciphertext: "{ciphertext}"}
    mutate:
      - {json_field: $.profile, name: fpe-profile}
    producer_expect: {status: [200], invariant: fpe_encrypt_output}
    expect:
      control: {status: [200], invariant: fpe_round_trip}
      mutated: {status: "4xx", json_error: true}

  # --- Deep: FPE ciphertext tamper (FF1 is unauthenticated) --------------------
  # The profile target above cannot cover the real FF1 risk: a corrupted
  # ciphertext is not required to error, so it needs its own oracle. Tamper one
  # byte of the captured ciphertext; the decrypt must not crash (no_server_error)
  # and must never round-trip back to the original plaintext.
  - name: vectis.fpe-ciphertext
    producer:
      method: POST
      path: "/fpe/encrypt/{kid}"
      auth: true
      replayable: false
      body: {ref: "{fpe_ref}", profile: "{fpe_profile}", plaintext: "{fpe_plaintext}"}
    capture: {fpe_kid: $.kid, ciphertext: $.ciphertext}
    consumer:
      method: POST
      path: /fpe/decrypt
      auth: true
      body: {ref: "{fpe_ref}", kid: "{fpe_kid}", profile: "{fpe_profile}", ciphertext: "{ciphertext}"}
    mutate:
      # FF1 is format-preserving over the numeric domain: tamper within the digit
      # alphabet so the decrypt actually runs (a non-digit char would be rejected at
      # input validation, testing parsing instead of ciphertext integrity).
      - {json_field: $.ciphertext, name: fpe-ciphertext, alphabet: "0123456789"}
    producer_expect: {status: [200], invariant: fpe_encrypt_output}
    expect:
      control: {status: [200], invariant: fpe_round_trip}
      mutated: {no_server_error: true, no_server_crash: true, invariant: fpe_ciphertext_integrity}

  # --- Deep: MAC create -> verify ----------------------------------------------
  - name: vectis.mac-verification
    producer:
      method: POST
      path: "/mac/{kid}"
      auth: true
      replayable: false
      body: {ref: "{mac_ref}", profile: "{mac_profile}", plaintext: "{mac_plaintext}"}
    capture: {mac_kid: $.kid, digest: $.digest}
    consumer:
      method: POST
      path: /mac/verify
      auth: true
      body: {ref: "{mac_ref}", kid: "{mac_kid}", profile: "{mac_profile}", plaintext: "{mac_plaintext}", digest: "{digest}"}
    mutate:
      # Hex is case-insensitive, so a bare case flip decodes to the same bytes and a
      # correct verifier still accepts it (false positive). Flip within the hex
      # alphabet so the digest is a genuinely different value.
      - {json_field: $.digest, name: mac-digest, alphabet: "0123456789abcdef"}
      - {json_field: $.plaintext, name: mac-plaintext}
    producer_expect: {status: [200], invariant: mac_create_output}
    expect:
      control: {status: [200], invariant: mac_verification_success}
      mutated: {status: [200], invariant: mac_verification_failure}

  # --- Blind indexes: persisted deterministic membership ----------------------
  # Indexes deliberately reuse the MAC profile. This shallow surface target
  # exercises malformed JSON against creation while ensuring a response never
  # reflects its input plaintext.
  - name: vectis.blind-index-create
    request:
      method: POST
      path: "/index/{kid}"
      auth: true
      body: {ref: "{index_ref}", profile: "{index_profile}", plaintext: "{index_plaintext}"}
    mutate:
      - {json_field: $.plaintext, name: blind-index-plaintext}
    expect:
      control: {status: [200], invariant: blind_index_create_output}
      mutated: {no_server_error: true}

  # Freshly persist a single digest, then distinguish membership from a valid
  # different plaintext. A false match is a contract failure, not an HTTP error.
  - name: vectis.blind-index-membership
    generative: false
    producer:
      method: POST
      path: "/index/{kid}"
      auth: true
      replayable: false
      body: {ref: "{index_ref}", profile: "{index_profile}", plaintext: "{index_plaintext}"}
    capture: {index_kid: $.kid, index_digest: $.index}
    consumer:
      method: POST
      path: /index/verify
      auth: true
      body: {ref: "{index_ref}", kid: "{index_kid}", profile: "{index_profile}", plaintext: "{index_plaintext}"}
    mutate:
      - {variable: index_plaintext, from_variable: index_mutated_plaintext, name: blind-index-plaintext}
    producer_expect: {status: [200], invariant: blind_index_create_output}
    expect:
      control: {status: [200], invariant: blind_index_membership}
      mutated: {status: [200], invariant: blind_index_nonmembership}

  # Batch create and verify preserve item order and bind each digest to its own
  # plaintext. Mutate only item one, so the expected result is [true, false].
  - name: vectis.blind-index-batch-membership
    generative: false
    flow:
      - step: create-batch
        request:
          method: POST
          path: "/index/batch/{kid}"
          auth: true
          replayable: false
          body:
            {profile: "{index_profile}", items: [{ref: "{index_batch_ref_zero}", plaintext: "{index_batch_plaintext_zero}"}, {ref: "{index_batch_ref_one}", plaintext: "{index_batch_plaintext_one}"}]}
        capture: {index_batch_kid: $.kid, index_batch_zero: $.items.0.index, index_batch_one: $.items.1.index}
        expect: {status: [200]}
      - step: verify-batch
        request:
          method: POST
          path: /index/verify/batch
          auth: true
          body:
            {kid: "{index_batch_kid}", profile: "{index_profile}", items: [{ref: "{index_batch_ref_zero}", plaintext: "{index_batch_plaintext_zero}"}, {ref: "{index_batch_ref_one}", plaintext: "{index_batch_plaintext_one}"}]}
        fuzz: true
        mutate:
          - {variable: index_batch_plaintext_one, from_variable: index_mutated_plaintext, name: blind-index-batch-plaintext}
        expect: {status: [200], invariant: blind_index_batch_membership}
        fuzz_expect: {status: [200], invariant: blind_index_batch_nonmembership}

  # Duplicate refs make the create batch invalid. The following independent
  # verify proves the entire batch rolled back instead of persisting item zero.
  - name: vectis.blind-index-batch-atomicity
    control: false
    generative: false
    flow:
      - step: rejected-create-batch
        request:
          method: POST
          path: "/index/batch/{kid}"
          auth: true
          replayable: false
          body:
            {profile: "{index_profile}", items: [{ref: "{index_atomic_ref_zero}", plaintext: "{index_atomic_plaintext_zero}"}, {ref: "{index_atomic_ref_one}", plaintext: "{index_atomic_plaintext_one}"}]}
        fuzz: true
        mutate:
          - {variable: index_atomic_ref_one, from_variable: index_atomic_ref_zero, name: blind-index-batch-duplicate-ref}
        expect: {status: [200]}
        fuzz_expect: {status: "4xx", json_error: true}
        continue_on_rejection: true
      - step: verify-no-partial-write
        request:
          method: POST
          path: /index/verify/batch
          auth: true
          body:
            {kid: "{kid}", profile: "{index_profile}", items: [{ref: "{index_atomic_ref_zero}", plaintext: "{index_atomic_plaintext_zero}"}, {ref: "{index_atomic_ref_one}", plaintext: "{index_atomic_plaintext_one}"}]}
        expect: {status: [200], invariant: blind_index_batch_atomicity}

  # --- Shallow: display masking -------------------------------------------------
  - name: vectis.masking
    request:
      method: POST
      path: "/mask/{kid}"
      auth: true
      body: {ref: "{mask_ref}", profile: "{mask_profile}", plaintext: "{mask_plaintext}"}
    mutate:
      - {json_field: $.profile, name: masking-profile}
    requires: [mask_expected]        # the invariant compares against it; not in any template
    expect:
      control: {status: [200], invariant: masking_output}
      mutated: {status: "4xx", json_error: true}

  # A second masking target keeps the policy arithmetic out of the fixture: the
  # target declares its inputs and the invariant derives the expected display.
  - name: vectis.masking-policy
    request:
      method: POST
      path: "/mask/{kid}"
      auth: true
      body: {ref: "{mask_policy_ref}", profile: "{mask_profile}", plaintext: "{mask_policy_plaintext}"}
    mutate:
      - {variable: mask_policy_plaintext, values: ["nadir-pan-001112", "nadir-pan-001113"], name: masking-policy-plaintext}
    requires: [mask_visible_first, mask_visible_last, mask_char]
    expect:
      control: {status: [200], invariant: masking_policy_output}
      mutated: {status: [200], invariant: masking_policy_output}

  # --- Deep: random token encode -> decode ------------------------------------
  # Mutating random token bytes preserves its envelope prefix but must never
  # recover the stored plaintext. The control also binds metadata round-trip.
  - name: vectis.token-round-trip
    producer:
      method: POST
      path: "/token/encode/{kid}"
      auth: true
      replayable: false
      body:
        {ref: "{token_ref}", profile: "{token_profile}", plaintext: "{token_plaintext}", metadata: {tenant: "{token_metadata_tenant}"}}
    capture: {token_kid: $.kid, token: $.token}
    consumer:
      method: POST
      path: /token/decode
      auth: true
      body: {ref: "{token_ref}", kid: "{token_kid}", profile: "{token_profile}", token: "{token}"}
    mutate:
      - {json_field: $.token, delimiter: "_", segments: [-1], name: token-random-bytes}
    producer_expect: {status: [200], invariant: token_output}
    expect:
      control: {status: [200], invariant: token_round_trip}
      mutated: {status: "4xx", json_error: true}

  # --- Flow: a one-time token cannot be decoded twice, even under attack -------
  # Single use is exercised on every iteration, not only the control run: mint a
  # token, consume it once in the valid preamble, then the fuzz step re-decodes the
  # SAME (now consumed) token. Whether that replay is clean or mutated it must be
  # rejected 404, so both the control and every mutated case assert single-use.
  - name: vectis.one-time-token
    flow:
      - step: encode
        request:
          method: POST
          path: "/token/encode/{kid}"
          auth: true
          replayable: false
          body:
            {ref: "{token_once_ref}", profile: "{token_once_profile}", plaintext: "{token_once_plaintext}", metadata: {tenant: "{token_once_metadata_tenant}"}}
        capture: {token_once_kid: $.kid, token_once: $.token}
        expect: {status: [200], invariant: token_once_output}
      - step: consume
        request:
          method: POST
          path: /token/decode
          auth: true
          body: {ref: "{token_once_ref}", kid: "{token_once_kid}", profile: "{token_once_profile}", token: "{token_once}"}
        expect: {status: [200], invariant: token_once_round_trip}
      - step: replay
        request:
          method: POST
          path: /token/decode
          auth: true
          body: {ref: "{token_once_ref}", kid: "{token_once_kid}", profile: "{token_once_profile}", token: "{token_once}"}
        fuzz: true
        mutate:
          - {json_field: $.token, delimiter: "_", segments: [-1], name: one-time-replay}
        expect: {status: [404], json_error: true}
        fuzz_expect: {status: [404], json_error: true}

  - name: vectis.one-time-token-race
    race:
      producer:
        method: POST
        path: "/token/encode/{kid}"
        auth: true
        replayable: false
        body: {ref: "{token_once_ref}", profile: "{token_once_profile}", plaintext: "{token_once_plaintext}", metadata: {tenant: "{token_once_metadata_tenant}"}}
      producer_expect: {status: [200], invariant: token_once_output}
      capture: {token_once_kid: $.kid, token_once: $.token}
      contenders:
        - step: decode-a
          request: {method: POST, path: /token/decode, auth: true, body: {ref: "{token_once_ref}", kid: "{token_once_kid}", profile: "{token_once_profile}", token: "{token_once}"}}
        - step: decode-b
          request: {method: POST, path: /token/decode, auth: true, body: {ref: "{token_once_ref}", kid: "{token_once_kid}", profile: "{token_once_profile}", token: "{token_once}"}}
      expect: {race_invariant: one_time_token_race}

  # A failed one-time batch decode must consume neither valid token. The final
  # valid decode proves rollback and preserves the submitted order.
  - name: vectis.one-time-token-batch-rollback
    control: false
    generative: false
    flow:
      - step: encode-batch
        request:
          method: POST
          path: "/token/encode/batch/{kid}"
          auth: true
          replayable: false
          body:
            {profile: "{token_once_profile}", items: [{ref: "{token_once_batch_ref_zero}", plaintext: "{token_once_plaintext}", metadata: {tenant: "{token_once_metadata_tenant}"}}, {ref: "{token_once_batch_ref_one}", plaintext: "{token_once_plaintext}", metadata: {tenant: "{token_once_metadata_tenant}"}}]}
        capture: {token_once_batch_kid: $.kid, token_once_batch_zero: $.items.0.token, token_once_batch_one: $.items.1.token}
        expect: {status: [200]}
      - step: failed-consume
        request:
          method: POST
          path: /token/decode/batch
          auth: true
          body:
            {profile: "{token_once_profile}", kid: "{token_once_batch_kid}", items: [{ref: "{token_once_batch_ref_zero}", token: "{token_once_batch_zero}"}, {ref: "{token_once_batch_ref_one}", token: "{token_once_batch_one}"}]}
        fuzz: true
        mutate:
          - {json_field: $.items.1.token, name: one-time-batch-token}
          - {variable: token_once_batch_ref_one, from_variable: token_once_batch_ref_zero, name: one-time-batch-duplicate-ref}
        expect: {status: [200]}
        fuzz_expect: {status: "4xx", json_error: true}
        continue_on_rejection: true
      - step: rollback-proof
        request:
          method: POST
          path: /token/decode/batch
          auth: true
          body:
            {profile: "{token_once_profile}", kid: "{token_once_batch_kid}", items: [{ref: "{token_once_batch_ref_zero}", token: "{token_once_batch_zero}"}, {ref: "{token_once_batch_ref_one}", token: "{token_once_batch_one}"}]}
        expect: {status: [200], invariant: one_time_token_batch_round_trip}

  # Randomized tokenization must not expose equality: same plaintext and profile
  # are encoded twice, then the second token still has to decode correctly.
  - name: vectis.token-randomness
    flow:
      - step: encode-first
        request:
          method: POST
          path: "/token/encode/{kid}"
          auth: true
          replayable: false
          body: {ref: "{token_ref}", profile: "{token_profile}", plaintext: "{token_plaintext}", metadata: {tenant: "{token_metadata_tenant}"}}
        capture: {first_token: $.token}
        expect: {status: [200], invariant: token_output}
      - step: encode-second
        request:
          method: POST
          path: "/token/encode/{kid}"
          auth: true
          replayable: false
          body: {ref: "{token_ref}", profile: "{token_profile}", plaintext: "{token_plaintext}", metadata: {tenant: "{token_metadata_tenant}"}}
        capture: {token_kid: $.kid, token: $.token}
        expect: {status: [200], invariant: token_distinct_output}
      - step: decode
        request:
          method: POST
          path: /token/decode
          auth: true
          body: {ref: "{token_ref}", kid: "{token_kid}", profile: "{token_profile}", token: "{token}"}
        fuzz: true
        mutate:
          - {json_field: $.profile, name: token-random-profile}
        expect: {status: [200], invariant: token_round_trip}
        fuzz_expect: {status: "4xx", json_error: true}

  # Reusable authorization matrix: malformed/missing credentials must be 401;
  # a real but ungranted client must be 403. Every protected operation below is
  # a normal declarative request, not an endpoint-specific engine branch.
  - name: vectis.sign-authorization
    request: {method: POST, path: "/sign/{kid}", auth: true, body: {message_hash: {alg: "SHA-256", hex: "{digest}"}}}
    mutate:
      - {variable: api_key, values: ["", "not-a-real-key"], name: authn-invalid}
      - {variable: api_key, from_variable: denied_api_key, name: authz-denied, expected_status: 403}
    expect:
      control: {status: [200], invariant: compact_signature_output}
      mutated: {authorization_matrix: true, json_error: true}

  - name: vectis.fpe-encrypt-authorization
    request: {method: POST, path: "/fpe/encrypt/{kid}", auth: true, body: {ref: "{fpe_ref}", profile: "{fpe_profile}", plaintext: "{fpe_plaintext}"}}
    mutate:
      - {variable: api_key, values: ["", "not-a-real-key"], name: authn-invalid}
      - {variable: api_key, from_variable: denied_api_key, name: authz-denied, expected_status: 403}
    expect:
      control: {status: [200], invariant: fpe_encrypt_output}
      mutated: {authorization_matrix: true, json_error: true}

  - name: vectis.mac-create-authorization
    request: {method: POST, path: "/mac/{kid}", auth: true, body: {ref: "{mac_ref}", profile: "{mac_profile}", plaintext: "{mac_plaintext}"}}
    mutate:
      - {variable: api_key, values: ["", "not-a-real-key"], name: authn-invalid}
      - {variable: api_key, from_variable: denied_api_key, name: authz-denied, expected_status: 403}
    expect:
      control: {status: [200], invariant: mac_create_output}
      mutated: {authorization_matrix: true, json_error: true}

  - name: vectis.blind-index-create-authorization
    request: {method: POST, path: "/index/{kid}", auth: true, body: {ref: "{index_ref}", profile: "{index_profile}", plaintext: "{index_plaintext}"}}
    mutate:
      - {variable: api_key, values: ["", "not-a-real-key"], name: authn-invalid}
      - {variable: api_key, from_variable: denied_api_key, name: authz-denied, expected_status: 403}
    expect:
      control: {status: [200], invariant: blind_index_create_output}
      mutated: {authorization_matrix: true, json_error: true}

  - name: vectis.blind-index-verify-authorization
    request: {method: POST, path: /index/verify, auth: true, body: {ref: "{index_verify_ref}", kid: "{kid}", profile: "{index_profile}", plaintext: "{index_verify_plaintext}"}}
    mutate:
      - {variable: api_key, values: ["", "not-a-real-key"], name: authn-invalid}
      - {variable: api_key, from_variable: denied_api_key, name: authz-denied, expected_status: 403}
    expect:
      control: {status: [200], invariant: blind_index_verify_nonmembership}
      mutated: {authorization_matrix: true, json_error: true}

  - name: vectis.mask-authorization
    request: {method: POST, path: "/mask/{kid}", auth: true, body: {ref: "{mask_ref}", profile: "{mask_profile}", plaintext: "{mask_plaintext}"}}
    mutate:
      - {variable: api_key, values: ["", "not-a-real-key"], name: authn-invalid}
      - {variable: api_key, from_variable: denied_api_key, name: authz-denied, expected_status: 403}
    expect:
      control: {status: [200], invariant: masking_output}
      mutated: {authorization_matrix: true, json_error: true}

  - name: vectis.token-encode-authorization
    request: {method: POST, path: "/token/encode/{kid}", auth: true, body: {ref: "{token_ref}", profile: "{token_profile}", plaintext: "{token_plaintext}", metadata: {tenant: "{token_metadata_tenant}"}}}
    mutate:
      - {variable: api_key, values: ["", "not-a-real-key"], name: authn-invalid}
      - {variable: api_key, from_variable: denied_api_key, name: authz-denied, expected_status: 403}
    expect:
      control: {status: [200], invariant: token_output}
      mutated: {authorization_matrix: true, json_error: true}

  # A valid scoped client has exactly fpe-encrypt for the active KID: its allowed
  # operation succeeds, while MAC remains denied below.
  - name: vectis.scoped-fpe-encrypt
    request: {method: POST, path: "/fpe/encrypt/{kid}", auth: scoped_api_key, body: {ref: "{fpe_ref}", profile: "{fpe_profile}", plaintext: "{fpe_plaintext}"}}
    mutate:
      - {json_field: $.profile, name: scoped-fpe-profile}
    expect:
      control: {status: [200], invariant: fpe_encrypt_output}
      mutated: {status: "4xx", json_error: true}

  - name: vectis.scoped-mac-denied
    request: {method: POST, path: "/mac/{kid}", auth: scoped_api_key, body: {ref: "{mac_ref}", profile: "{mac_profile}", plaintext: "{mac_plaintext}"}}
    mutate:
      - {json_field: $.plaintext, name: scoped-mac-plaintext}
    expect:
      control: {status: [403], json_error: true}
      mutated: {status: [403], json_error: true}

  # This KID was transitioned to retired by the fixture after minting ciphertext.
  # New FPE use is blocked; the matching historical decrypt remains available.
  - name: vectis.retired-fpe-encrypt-blocked
    request: {method: POST, path: "/fpe/encrypt/{retired_kid}", auth: true, body: {ref: "{retired_fpe_ref}", profile: "{retired_fpe_profile}", plaintext: "{retired_fpe_plaintext}"}}
    mutate:
      - {json_field: $.plaintext, name: retired-fpe-plaintext}
    expect:
      control: {status: "4xx", json_error: true}
      mutated: {status: "4xx", json_error: true}

  - name: vectis.retired-fpe-decrypt
    request: {method: POST, path: /fpe/decrypt, auth: true, body: {ref: "{retired_fpe_ref}", kid: "{retired_kid}", profile: "{retired_fpe_profile}", ciphertext: "{retired_fpe_ciphertext}"}}
    mutate:
      - {json_field: $.profile, name: retired-fpe-profile}
    expect:
      control: {status: [200], invariant: retired_fpe_round_trip}
      mutated: {status: "4xx", json_error: true}
