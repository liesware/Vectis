    expect:
      control: {status: [200], invariant: masking_output}
      mutated: {authorization_matrix: true, json_error: true}

  - name: vectis.token-encode-authorization
    request: {method: POST, path: "/token/encode/{kid}", auth: true, body: {ref: "{token_ref}", profile: "{token_profile}", plaintext: "{token_plaintext}", metadata: {tenant: "{token_metadata_tenant}"}}}
    mutate:
      - {variable: api_key, values: ["", "not-a-real-key"], name: authn-invalid}
      - {variable: api_key, from_variable: denied_api_key, name: authz-denied, expected_status: 403}
    expect:
      control: {status: [200], invariant: token_output}
      mutated: {authorization_matrix: true, json_error: true}

  # A valid scoped client has exactly fpe-encrypt for the active KID: its allowed
  # operation succeeds, while MAC remains denied below.
  - name: vectis.scoped-fpe-encrypt
    request: {method: POST, path: "/fpe/encrypt/{kid}", auth: scoped_api_key, body: {ref: "{fpe_ref}", profile: "{fpe_profile}", plaintext: "{fpe_plaintext}"}}
    mutate:
      - {json_field: $.profile, name: scoped-fpe-profile}
    expect:
      control: {status: [200], invariant: fpe_encrypt_output}
      mutated: {status: "4xx", json_error: true}

  - name: vectis.scoped-mac-denied
    request: {method: POST, path: "/mac/{kid}", auth: scoped_api_key, body: {ref: "{mac_ref}", profile: "{mac_profile}", plaintext: "{mac_plaintext}"}}
    mutate:
      - {json_field: $.plaintext, name: scoped-mac-plaintext}
    expect:
      control: {status: [403], json_error: true}
      mutated: {status: [403], json_error: true}

  # This KID was transitioned to retired by the fixture after minting ciphertext.
  # New FPE use is blocked; the matching historical decrypt remains available.
  - name: vectis.retired-fpe-encrypt-blocked
    request: {method: POST, path: "/fpe/encrypt/{retired_kid}", auth: true, body: {ref: "{retired_fpe_ref}", profile: "{retired_fpe_profile}", plaintext: "{retired_fpe_plaintext}"}}
    mutate:
      - {json_field: $.plaintext, name: retired-fpe-plaintext}
    expect:
      control: {status: "4xx", json_error: true}
      mutated: {status: "4xx", json_error: true}

  - name: vectis.retired-fpe-decrypt
    request: {method: POST, path: /fpe/decrypt, auth: true, body: {ref: "{retired_fpe_ref}", kid: "{retired_kid}", profile: "{retired_fpe_profile}", ciphertext: "{retired_fpe_ciphertext}"}}
    mutate:
      - {json_field: $.profile, name: retired-fpe-profile}
    expect:
      control: {status: [200], invariant: retired_fpe_round_trip}
      mutated: {status: "4xx", json_error: true}

  # --- Batch: ordered pairs, whole-request rejection, and state semantics ----
  - name: vectis.fpe-batch-round-trip
    generative: false
    flow:
      - step: encrypt-batch
        request: {method: POST, path: "/fpe/encrypt/batch/{kid}", auth: true, replayable: false, body: {profile: "{fpe_profile}", items: [{ref: "{fpe_batch_ref_zero}", plaintext: "{fpe_batch_plaintext_zero}"}, {ref: "{fpe_batch_ref_one}", plaintext: "{fpe_batch_plaintext_one}"}]}}
        capture: {fpe_batch_kid: $.kid, fpe_batch_ciphertext_zero: $.items.0.ciphertext, fpe_batch_ciphertext_one: $.items.1.ciphertext}
        expect: {status: [200], invariant: fpe_batch_encrypt_output}
      - step: decrypt-batch
        request: {method: POST, path: /fpe/decrypt/batch, auth: true, body: {kid: "{fpe_batch_kid}", profile: "{fpe_profile}", items: [{ref: "{fpe_batch_ref_zero}", ciphertext: "{fpe_batch_ciphertext_zero}"}, {ref: "{fpe_batch_ref_one}", ciphertext: "{fpe_batch_ciphertext_one}"}]}}
        fuzz: true
        mutate:
          - {json_field: $.items.1.ciphertext, name: fpe-batch-ciphertext, alphabet: "0123456789"}
        expect: {status: [200], invariant: fpe_batch_round_trip}
        fuzz_expect: {no_server_error: true, no_server_crash: true, invariant: fpe_batch_ciphertext_integrity}

  - name: vectis.fpe-batch-validation
    generative: false
    request: {method: POST, path: "/fpe/encrypt/batch/{kid}", auth: true, body: {profile: "{fpe_profile}", items: [{ref: "{fpe_batch_ref_zero}", plaintext: "{fpe_batch_plaintext_zero}"}, {ref: "{fpe_batch_ref_one}", plaintext: "{fpe_batch_plaintext_one}"}]}}
    mutate:
      - {variable: fpe_batch_ref_one, from_variable: fpe_batch_ref_zero, name: fpe-batch-duplicate-ref}
    expect:
      control: {status: [200], invariant: fpe_batch_encrypt_output}
      mutated: {status: "4xx", json_error: true, forbidden_json_fields: [items]}

  - name: vectis.token-batch-round-trip
    generative: false
    artifact_redact_captures: [token_batch_zero, token_batch_one]
    flow:
      - step: encode-batch
        request: {method: POST, path: "/token/encode/batch/{kid}", auth: true, replayable: false, body: {profile: "{token_profile}", items: [{ref: "{token_batch_ref_zero}", plaintext: "{token_batch_plaintext_zero}", metadata: {tenant: "{token_batch_metadata_zero}"}}, {ref: "{token_batch_ref_one}", plaintext: "{token_batch_plaintext_one}", metadata: {tenant: "{token_batch_metadata_one}"}}]}}
        capture: {token_batch_kid: $.kid, token_batch_zero: $.items.0.token, token_batch_one: $.items.1.token}
        expect: {status: [200], invariant: token_batch_encode_output}
      - step: rejected-decode-batch
        request: {method: POST, path: /token/decode/batch, auth: true, body: {kid: "{token_batch_kid}", profile: "{token_profile}", items: [{ref: "{token_batch_ref_zero}", token: "{token_batch_zero}"}, {ref: "{token_batch_ref_one}", token: "{token_batch_one}"}]}}
        fuzz: true
        mutate:
          - {json_field: $.items.1.token, name: token-batch-tamper}
        expect: {status: [200], invariant: token_batch_round_trip}
        fuzz_expect: {status: "4xx", json_error: true, forbidden_json_fields: [items]}
        continue_on_rejection: true
      - step: reusable-rollback-proof
        request: {method: POST, path: /token/decode/batch, auth: true, body: {kid: "{token_batch_kid}", profile: "{token_profile}", items: [{ref: "{token_batch_ref_zero}", token: "{token_batch_zero}"}, {ref: "{token_batch_ref_one}", token: "{token_batch_one}"}]}}
        expect: {status: [200], invariant: token_batch_round_trip}

  - name: vectis.token-batch-validation
    generative: false
    request: {method: POST, path: "/token/encode/batch/{kid}", auth: true, body: {profile: "{token_profile}", items: [{ref: "{token_batch_ref_zero}", plaintext: "{token_batch_plaintext_zero}", metadata: {tenant: "{token_batch_metadata_zero}"}}, {ref: "{token_batch_ref_one}", plaintext: "{token_batch_plaintext_one}", metadata: {tenant: "{token_batch_metadata_one}"}}]}}
    mutate:
      - {variable: token_batch_ref_one, from_variable: token_batch_ref_zero, name: token-batch-duplicate-ref}
    expect:
      control: {status: [200], invariant: token_batch_encode_output}
      mutated: {status: "4xx", json_error: true, forbidden_json_fields: [items]}

  - name: vectis.one-time-token-batch-replay
    generative: false
    artifact_redact_captures: [token_once_batch_zero, token_once_batch_one]
    flow:
      - step: encode-batch
        request: {method: POST, path: "/token/encode/batch/{kid}", auth: true, replayable: false, body: {profile: "{token_once_profile}", items: [{ref: "{token_once_batch_ref_zero}", plaintext: "{token_once_plaintext}", metadata: {tenant: "{token_once_metadata_tenant}"}}, {ref: "{token_once_batch_ref_one}", plaintext: "{token_once_plaintext}", metadata: {tenant: "{token_once_metadata_tenant}"}}]}}
        capture: {token_once_batch_kid: $.kid, token_once_batch_zero: $.items.0.token, token_once_batch_one: $.items.1.token}
        expect: {status: [200]}
      - step: consume-batch
        request: {method: POST, path: /token/decode/batch, auth: true, body: {kid: "{token_once_batch_kid}", profile: "{token_once_profile}", items: [{ref: "{token_once_batch_ref_zero}", token: "{token_once_batch_zero}"}, {ref: "{token_once_batch_ref_one}", token: "{token_once_batch_one}"}]}}
        expect: {status: [200], invariant: one_time_token_batch_round_trip}
      - step: replay-batch
        request: {method: POST, path: /token/decode/batch, auth: true, body: {kid: "{token_once_batch_kid}", profile: "{token_once_profile}", items: [{ref: "{token_once_batch_ref_zero}", token: "{token_once_batch_zero}"}, {ref: "{token_once_batch_ref_one}", token: "{token_once_batch_one}"}]}}
        fuzz: true
        mutate:
          - {json_field: $.items.1.token, name: one-time-batch-replay}
        # Unmutated replay of consumed tokens must be 404 (already consumed). The
        # fuzz path mutates a token, so the server may instead reject it as malformed
        # (400, "token prefix does not match"): either is a clean rejection. What must
        # hold in both is a JSON error with no partial items — never a revived token.
        expect: {status: [404], json_error: true, forbidden_json_fields: [items]}
        fuzz_expect: {status: "4xx", json_error: true, forbidden_json_fields: [items]}

  - name: vectis.one-time-token-batch-race
    artifact_redact_captures: [token_once_batch_zero, token_once_batch_one]
    race:
      producer: {method: POST, path: "/token/encode/batch/{kid}", auth: true, replayable: false, body: {profile: "{token_once_profile}", items: [{ref: "{token_once_batch_ref_zero}", plaintext: "{token_once_plaintext}", metadata: {tenant: "{token_once_metadata_tenant}"}}, {ref: "{token_once_batch_ref_one}", plaintext: "{token_once_plaintext}", metadata: {tenant: "{token_once_metadata_tenant}"}}]}}
      capture: {token_once_batch_kid: $.kid, token_once_batch_zero: $.items.0.token, token_once_batch_one: $.items.1.token}
      contenders:
        - step: decode-a
          request: {method: POST, path: /token/decode/batch, auth: true, body: {kid: "{token_once_batch_kid}", profile: "{token_once_profile}", items: [{ref: "{token_once_batch_ref_zero}", token: "{token_once_batch_zero}"}, {ref: "{token_once_batch_ref_one}", token: "{token_once_batch_one}"}]}}
        - step: decode-b
          request: {method: POST, path: /token/decode/batch, auth: true, body: {kid: "{token_once_batch_kid}", profile: "{token_once_profile}", items: [{ref: "{token_once_batch_ref_zero}", token: "{token_once_batch_zero}"}, {ref: "{token_once_batch_ref_one}", token: "{token_once_batch_one}"}]}}
      expect: {race_invariant: one_time_token_batch_race}

  - name: vectis.mac-batch-round-trip
    generative: false
    flow:
      - step: create-batch
        request: {method: POST, path: "/mac/batch/{kid}", auth: true, replayable: false, body: {profile: "{mac_profile}", items: [{ref: "{mac_batch_ref_zero}", plaintext: "{mac_batch_plaintext_zero}"}, {ref: "{mac_batch_ref_one}", plaintext: "{mac_batch_plaintext_one}"}]}}
        capture: {mac_batch_kid: $.kid, mac_batch_digest_zero: $.items.0.digest, mac_batch_digest_one: $.items.1.digest}
        expect: {status: [200], invariant: mac_batch_create_output}
      - step: verify-batch
        request: {method: POST, path: /mac/verify/batch, auth: true, body: {kid: "{mac_batch_kid}", profile: "{mac_profile}", items: [{ref: "{mac_batch_ref_zero}", plaintext: "{mac_batch_plaintext_zero}", digest: "{mac_batch_digest_zero}"}, {ref: "{mac_batch_ref_one}", plaintext: "{mac_batch_plaintext_one}", digest: "{mac_batch_digest_one}"}]}}
        fuzz: true
        mutate:
          - {variable: mac_batch_plaintext_one, from_variable: mac_batch_mutated_plaintext, name: mac-batch-plaintext}
        expect: {status: [200], invariant: mac_batch_verification_success}
        fuzz_expect: {status: [200], invariant: mac_batch_verification_failure}

