[package]
name = "vectis-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1"
zeroize = "1.9.0"

[dependencies.vectis]
path = ".."

# Fuzz targets build in the release profile. Force integer-overflow checks and
# debug assertions on so that silent wrapping arithmetic anywhere under fuzz —
# not just where the code happens to use saturating_* — is caught as a panic and
# reported as a finding. For a cryptographic library, silent overflow is a
# corruption class, so it must never pass unnoticed.
[profile.release]
overflow-checks = true
debug-assertions = true

[[bin]]
name = "fuzz_canonical_json"
path = "fuzz_targets/fuzz_canonical_json.rs"
test = false
doc = false
bench = false

