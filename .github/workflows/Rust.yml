name: Rust

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  VECTIS_SQLITE_PATH: ${{ github.workspace }}/.ci/vectis-test.db

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          shared-key: vectis-ci
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Prepare SQLite test storage
        shell: bash
        run: |
          mkdir -p .ci
          sqlite3 "$VECTIS_SQLITE_PATH" < src/db/sqlite_schema.sql

      - name: Format
        run: cargo fmt --check

      - name: Test all targets
        run: cargo test --locked --all-targets --all-features

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Validate shell scripts
        run: |
          bash -n tests.sh
          bash -n tests_cargo-fuzz.sh
          bash -n demo/local/*.sh
          bash -n tests/ci/*.sh
          bash -n tests/integration/tls/*.sh
          bash -n tests/security/zap/*.sh
          bash -n tests/performance/*.sh
          bash -n tests/performance/local/*.sh

      - name: Install cargo-audit
        uses: taiki-e/install-action@742a3317eac7bd62f91cd888b4eead5e784ba833 # v2
        with:
          tool: cargo-audit

      - name: Audit dependencies
        run: cargo audit

      - name: Build vectis binary
        run: cargo build --locked --all-features

      - name: Upload vectis binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vectis-bin
          path: target/debug/vectis

  integration:
    name: Python integration tests
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download vectis binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vectis-bin

      - name: Make vectis binary executable
        run: chmod +x vectis

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          # .python-version pins 3.14, which the runner does not preinstall, so
          # uv downloads the ~34 MB CPython each run. Cache the managed interpreter
          # so only the first run (or a version bump) pays the download.
          cache-python: true

      - name: Run Python integration suites
        env:
          VECTIS_BIN: ${{ github.workspace }}/vectis
        run: bash tests/ci/run-integration.sh

      - name: HTTPS health smoke test
        env:
          VECTIS_BIN: ${{ github.workspace }}/vectis
        run: bash tests/ci/test-tls.sh

      - name: Summarize HTTP fuzz campaigns
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as output:
              output.write("## HTTP fuzz\n\nDiversity is per-run input uniqueness, not code coverage.\n\n")
              for mode in ("regression", "exploration"):
                  path = Path(".ci/http-fuzz") / f"{mode}.json"
                  output.write(f"### {mode.title()}\n\n")
                  if not path.exists():
                      output.write("No summary generated; the campaign was skipped or could not start.\n\n")
                      continue
                  report = json.loads(path.read_text(encoding="utf-8"))
                  config = report["config"]
                  output.write(f"Result: **{report['result']}**; root seed: `{config['seed']}`; "
                               f"budget: {config['iterations']} cases per target.\n\n")
                  output.write("| Target | Kind | Completed | Cases | Passed | Failed | Unique | Duplicates |\n")
                  output.write("| --- | --- | --- | ---: | ---: | ---: | ---: | ---: |\n")
                  for target in report["targets"]:
                      output.write(f"| {target['target']} | {target['kind']} | {target['completed']} | "
                                   f"{target['cases']} | {target['passed']} | {target['failed']} | "
                                   f"{target.get('unique_inputs', '-')} | {target.get('duplicate_inputs', '-')} |\n")
                  output.write("\nFull seeds, primary status distributions and counts are in the summary artifact.\n\n")
          PY

      - name: Upload HTTP fuzz summaries
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: http-fuzz-summaries-${{ github.run_id }}
          path: .ci/http-fuzz/*.json
          if-no-files-found: warn
          retention-days: 30

      - name: Upload HTTP fuzz findings
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: http-fuzz-findings-${{ github.run_id }}
          path: tests/security/fuzz/fuzz-corpus/
          if-no-files-found: ignore
          retention-days: 30
