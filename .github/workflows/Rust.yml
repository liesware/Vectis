name: Rust

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always
  VECTIS_SQLITE_PATH: ${{ github.workspace }}/.ci/vectis-test.db

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Prepare SQLite test storage
        shell: bash
        run: |
          mkdir -p .ci
          sqlite3 "$VECTIS_SQLITE_PATH" < src/db/sqlite_schema.sql

      - name: Format
        run: cargo fmt --check

      - name: Check all targets
        run: cargo check --locked --all-targets --all-features

      - name: Test all targets
        run: cargo test --locked --all-targets

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Validate shell scripts
        run: |
          bash -n tests.sh
          bash -n tests_cargo-fuzz.sh
          bash -n demo/local/*.sh
          bash -n tests/ci/*.sh
          bash -n tests/performance/*.sh
          bash -n tests/performance/local/*.sh

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Audit dependencies
        run: cargo audit

  integration:
    name: Python integration tests
    needs: verify
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true

      - name: Run Python integration suites
        run: bash tests/ci/run-integration.sh
