name: Release Image

on:
  workflow_dispatch:
    inputs:
      push_image:
        description: Publish the test image to Docker Hub
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-image-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: docker.io/liesware/vectis

jobs:
  metadata:
    name: Resolve image metadata
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.metadata.outputs.tag }}
      image_ref: ${{ steps.metadata.outputs.image_ref }}
    steps:
      - name: Set image metadata
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          echo "tag=test" >> "$GITHUB_OUTPUT"
          echo "image_ref=${IMAGE_NAME}:test" >> "$GITHUB_OUTPUT"

  build-image:
    name: Build test image without publishing
    if: ${{ !inputs.push_image }}
    needs: metadata
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build image for scan (amd64)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: image/Dockerfile.tag
          platforms: linux/amd64
          load: true
          provenance: false
          cache-from: type=gha,scope=release-image
          cache-to: type=gha,mode=max,scope=release-image
          tags: ${{ needs.metadata.outputs.image_ref }}

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ needs.metadata.outputs.image_ref }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy-image

      - name: Build test image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: image/Dockerfile.tag
          platforms: linux/amd64,linux/arm64
          push: false
          provenance: false
          cache-from: type=gha,scope=release-image
          cache-to: type=gha,mode=max,scope=release-image
          tags: ${{ needs.metadata.outputs.image_ref }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.metadata.outputs.tag }}

  publish-image:
    name: Publish and verify test image
    if: ${{ inputs.push_image }}
    needs: metadata
    runs-on: ubuntu-latest
    environment: Release
    permissions:
      contents: read
      id-token: write
      attestations: write
      security-events: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build image for scan (amd64)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: image/Dockerfile.tag
          platforms: linux/amd64
          load: true
          provenance: false
          cache-from: type=gha,scope=release-image
          cache-to: type=gha,mode=max,scope=release-image
          tags: ${{ needs.metadata.outputs.image_ref }}

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ needs.metadata.outputs.image_ref }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy-image

      - name: Log in to Docker Hub
        uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4.5.2
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and publish test image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: image/Dockerfile.tag
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          cache-from: type=gha,scope=release-image
          cache-to: type=gha,mode=max,scope=release-image
          tags: ${{ needs.metadata.outputs.image_ref }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.metadata.outputs.tag }}

      - name: Attest published image provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Verify published manifest
        env:
          IMAGE_REF: ${{ needs.metadata.outputs.image_ref }}
        shell: bash
        run: |
          set -euo pipefail
          docker buildx imagetools inspect --raw "$IMAGE_REF" \
            | jq -e '
                [.manifests[].platform | "\(.os)/\(.architecture)"]
                | index("linux/amd64") != null
                  and index("linux/arm64") != null
              ' >/dev/null

      - name: Run published AMD64 image
        env:
          IMAGE_REF: ${{ needs.metadata.outputs.image_ref }}
        shell: bash
        run: |
          set -euo pipefail
          docker pull "$IMAGE_REF"
          docker run --rm \
            --entrypoint /opt/vectis/bin/vectis \
            "$IMAGE_REF" \
            version
