name: Release Image

on:
  workflow_dispatch:
    inputs:
      push_image:
        description: Publish the test image to Docker Hub
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-image-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: docker.io/liesware/vectis

jobs:
  build-image:
    name: Build test image without publishing
    if: ${{ !inputs.push_image }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set image metadata
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          echo "tag=test-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          echo "image_ref=${IMAGE_NAME}:test-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build test image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: image/Dockerfile.tag
          platforms: linux/amd64,linux/arm64
          push: false
          provenance: false
          cache-from: type=gha,scope=release-image
          cache-to: type=gha,mode=max,scope=release-image
          tags: ${{ steps.metadata.outputs.image_ref }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.metadata.outputs.tag }}

  publish-image:
    name: Publish and verify test image
    if: ${{ inputs.push_image }}
    runs-on: ubuntu-latest
    environment: Release
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set image metadata
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          echo "tag=test-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          echo "image_ref=${IMAGE_NAME}:test-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and publish test image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: image/Dockerfile.tag
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          cache-from: type=gha,scope=release-image
          cache-to: type=gha,mode=max,scope=release-image
          tags: ${{ steps.metadata.outputs.image_ref }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.metadata.outputs.tag }}

      - name: Attest published image provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Verify published manifest
        env:
          IMAGE_REF: ${{ steps.metadata.outputs.image_ref }}
        shell: bash
        run: |
          set -euo pipefail
          docker buildx imagetools inspect --raw "$IMAGE_REF" \
            | jq -e '
                [.manifests[].platform | "\(.os)/\(.architecture)"]
                | index("linux/amd64") != null
                  and index("linux/arm64") != null
              ' >/dev/null

      - name: Run published AMD64 image
        env:
          IMAGE_REF: ${{ steps.metadata.outputs.image_ref }}
        shell: bash
        run: |
          set -euo pipefail
          docker pull "$IMAGE_REF"
          docker run --rm \
            --entrypoint /opt/vectis/bin/vectis \
            "$IMAGE_REF" \
            version
