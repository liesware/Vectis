name: Release Image

on:
  workflow_dispatch:
    inputs:
      push_image:
        description: Publish the test image to Docker Hub
        required: true
        default: false
        type: boolean
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-image-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: docker.io/liesware/vectis

jobs:
  metadata:
    name: Resolve image metadata
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      tag: ${{ steps.metadata.outputs.tag }}
      image_ref: ${{ steps.metadata.outputs.image_ref }}
      publish: ${{ steps.metadata.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Resolve image metadata
        id: metadata
        env:
          REQUESTED_PUSH: ${{ inputs.push_image || false }}
        shell: bash
        run: |
          set -euo pipefail

          case "$GITHUB_EVENT_NAME" in
            workflow_dispatch)
              tag="test"
              publish="$REQUESTED_PUSH"
              if [[ "$publish" != "true" && "$publish" != "false" ]]; then
                echo "::error::push_image must resolve to true or false"
                exit 1
              fi
              if [[ "$publish" == "true" && "$GITHUB_REF" != "refs/heads/main" ]]; then
                echo "::error::The test image may only be published from refs/heads/main"
                exit 1
              fi
              ;;
            push)
              if [[ "$GITHUB_REF_TYPE" != "tag" ]]; then
                echo "::error::Automatic image publication requires a Git tag"
                exit 1
              fi
              version="$(
                cargo metadata --locked --no-deps --format-version 1 \
                  | jq -er '.packages[] | select(.name == "vectis") | .version'
              )"
              expected_tag="v${version}"
              if [[ "$GITHUB_REF_NAME" != "$expected_tag" ]]; then
                echo "::error::Git tag $GITHUB_REF_NAME does not match Cargo version $expected_tag"
                exit 1
              fi
              tag="$version"
              publish="true"
              ;;
            *)
              echo "::error::Unsupported event: $GITHUB_EVENT_NAME"
              exit 1
              ;;
          esac

          if (( ${#tag} > 128 )) \
            || [[ ! "$tag" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]
          then
            echo "::error::Resolved Docker tag is not OCI-compatible: $tag"
            exit 1
          fi

          {
            echo "tag=$tag"
            echo "image_ref=${IMAGE_NAME}:$tag"
            echo "publish=$publish"
          } >> "$GITHUB_OUTPUT"

  build-image:
    name: Build and scan ${{ matrix.platform }}
    if: ${{ needs.metadata.outputs.publish == 'false' }}
    needs: metadata
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            slug: amd64
            category: trivy-image
          - platform: linux/arm64
            slug: arm64
            category: trivy-image-arm64

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image for scan
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: image/Dockerfile.tag
          build-args: |
            VECTIS_BUILD_COMMIT=${{ github.sha }}
          platforms: ${{ matrix.platform }}
          load: true
          provenance: false
          cache-from: type=gha,scope=release-image-${{ matrix.slug }}
          cache-to: type=gha,mode=max,scope=release-image-${{ matrix.slug }}
          tags: ${{ env.IMAGE_NAME }}:scan-${{ matrix.slug }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.metadata.outputs.tag }}

      - name: Prepare ${{ matrix.slug }} SBOM subject
        id: sbom_subject_local
        env:
          IMAGE_REF: ${{ steps.build.outputs.imageid }}
          IMAGE_SOURCE: docker
          PLATFORM: ${{ matrix.platform }}
          SLUG: ${{ matrix.slug }}
          SBOM_BASE: .ci/sbom/${{ matrix.slug }}/vectis-image-${{ matrix.slug }}
          SBOM_REPORT: .ci/sbom/${{ matrix.slug }}/inventory.json
        shell: bash
        run: &prepare-image-sbom |
          set -euo pipefail
          [[ "$IMAGE_REF" =~ (^sha256:[0-9a-f]{64}$|@sha256:[0-9a-f]{64}$) ]]
          mkdir -p ".ci/sbom/$SLUG"
          touch ".ci/sbom/$SLUG/empty.trivyignore"
          if [[ "$IMAGE_SOURCE" == remote ]]; then
            docker pull --platform "$PLATFORM" "$IMAGE_REF"
          fi
          actual_platform="$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$IMAGE_REF")"
          test "$actual_platform" = "$PLATFORM"
          container="$(docker create --platform "$PLATFORM" "$IMAGE_REF")"
          trap 'docker rm "$container" >/dev/null' EXIT
          docker cp "$container:/opt/vectis/share/build-info.json" ".ci/sbom/$SLUG/build-info.json"
          docker cp "$container:/opt/vectis/bin/vectis" ".ci/sbom/$SLUG/vectis"
          binary_hash="$(sha256sum ".ci/sbom/$SLUG/vectis" | cut -d' ' -f1)"
          jq -e --arg commit "$GITHUB_SHA" --arg platform "$PLATFORM" --arg hash "$binary_hash" '
            .schema_version == 1 and .commit == $commit and .platform == $platform and
            .binary.sha256 == $hash and .tools["cargo-auditable"] == "0.7.7" and
            (.botan.native_version | type == "string" and length > 0) and
            (.botan.source_sha256 | test("^[0-9a-f]{64}$")) and
            (.botan.crates | has("botan") and has("botan-sys") and has("botan-src"))
          ' ".ci/sbom/$SLUG/build-info.json" > /dev/null

      - name: Inventory ${{ matrix.slug }} SBOM subject
        id: sbom_scan_local
        if: ${{ steps.sbom_subject_local.outcome == 'success' }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_IGNOREFILE: .ci/sbom/${{ matrix.slug }}/empty.trivyignore
          TRIVY_IMAGE_SRC: docker
        with:
          version: v0.70.0
          image-ref: ${{ steps.build.outputs.imageid }}
          scanners: vuln
          format: json
          output: .ci/sbom/${{ matrix.slug }}/inventory.json
          list-all-pkgs: "true"
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "0"

      - name: Convert and validate ${{ matrix.slug }} image SBOM
        id: sbom_local
        if: ${{ steps.sbom_scan_local.outcome == 'success' }}
        env:
          IMAGE_REF: ${{ steps.build.outputs.imageid }}
          IMAGE_SOURCE: docker
          PLATFORM: ${{ matrix.platform }}
          SLUG: ${{ matrix.slug }}
          SBOM_BASE: .ci/sbom/${{ matrix.slug }}/vectis-image-${{ matrix.slug }}
          SBOM_REPORT: .ci/sbom/${{ matrix.slug }}/inventory.json
        shell: bash
        run: &complete-image-sbom |
          set -euo pipefail
          trivy --version | grep -Eq '^Version: 0\.70\.0$'
          jq -e '
            .SchemaVersion == 2 and
            ([.Results[]? | select(.Type == "rustbinary") | .Packages[]?] | length > 0) and
            ([.Results[]? | select(.Type == "rustbinary") | .Packages[]?.Name] |
              (index("botan") != null and index("botan-sys") != null))
          ' "$SBOM_REPORT" > /dev/null
          trivy convert --format cyclonedx --output "$SBOM_BASE.cdx.json" "$SBOM_REPORT"
          trivy convert --format spdx-json --output "$SBOM_BASE.spdx.json" "$SBOM_REPORT"
          jq -e '.bomFormat == "CycloneDX" and .specVersion == "1.6" and (.components | length > 0)' "$SBOM_BASE.cdx.json" > /dev/null
          jq -e '.spdxVersion == "SPDX-2.3" and (.packages | length > 0)' "$SBOM_BASE.spdx.json" > /dev/null
          jq -r '[.components[]? | .purl // empty] | unique[]' "$SBOM_BASE.cdx.json" > "$SBOM_REPORT.cdx-purls"
          # SPDX lists the image itself as a package; CycloneDX puts it in metadata.
          image_purl="$(jq -r '.metadata.component.purl // ""' "$SBOM_BASE.cdx.json")"
          jq -r --arg image "$image_purl" '[.packages[]? | .externalRefs[]? | select(.referenceType == "purl") | .referenceLocator | select(. != $image)] | unique[]' "$SBOM_BASE.spdx.json" > "$SBOM_REPORT.spdx-purls"
          jq -r '[.Results[]? | .Packages[]? | .Identifier.PURL // empty] | unique[]' "$SBOM_REPORT" > "$SBOM_REPORT.source-purls"
          test -s "$SBOM_REPORT.cdx-purls"
          diff -u "$SBOM_REPORT.source-purls" "$SBOM_REPORT.cdx-purls"
          diff -u "$SBOM_REPORT.cdx-purls" "$SBOM_REPORT.spdx-purls"

          jq -e '.ArtifactType == "container_image" and ([.Results[]? | select(.Class == "os-pkgs") | .Packages[]?] | length > 0)' "$SBOM_REPORT" > /dev/null
          jq --arg image "$IMAGE_REF" --arg platform "$PLATFORM" --arg trivy "$(trivy --version | head -n 1)" '
            .image = {reference: $image, platform: $platform} | .tools.trivy = $trivy
          ' ".ci/sbom/$SLUG/build-info.json" > "$SBOM_BASE.build-info.json"
          jq -n --arg image "$IMAGE_REF" --arg platform "$PLATFORM" --arg commit "$GITHUB_SHA" \
            --arg cdx "$(sha256sum "$SBOM_BASE.cdx.json" | cut -d' ' -f1)" \
            --arg spdx "$(sha256sum "$SBOM_BASE.spdx.json" | cut -d' ' -f1)" \
            --arg info "$(sha256sum "$SBOM_BASE.build-info.json" | cut -d' ' -f1)" \
            '{image: $image, platform: $platform, commit: $commit, sha256: {cyclonedx: $cdx, spdx: $spdx, build_info: $info}}' \
            > "$SBOM_BASE.subject.json"
          rm ".ci/sbom/$SLUG/vectis"

      - name: Generate readable Trivy report
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.70.0
          image-ref: ${{ env.IMAGE_NAME }}:scan-${{ matrix.slug }}
          format: table
          output: trivy-results-${{ matrix.slug }}.txt
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"

      - name: Enforce Trivy security gate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.70.0
          image-ref: ${{ env.IMAGE_NAME }}:scan-${{ matrix.slug }}
          format: sarif
          output: trivy-results-${{ matrix.slug }}.sarif
          severity: CRITICAL,HIGH
          limit-severities-for-sarif: true
          ignore-unfixed: true
          exit-code: "1"

      - name: Preserve image SBOM evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          include-hidden-files: true
          name: sbom-image-${{ matrix.slug }}
          path: |
            .ci/sbom/**/inventory.json*
            .ci/sbom/**/*.cdx.json
            .ci/sbom/**/*.spdx.json
            .ci/sbom/**/*build-info.json
            .ci/sbom/**/*.subject.json
            .ci/sbom/**/*.verified.json
          if-no-files-found: warn
          retention-days: 30

      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          sarif_file: trivy-results-${{ matrix.slug }}.sarif
          category: ${{ matrix.category }}

      - name: Upload Trivy reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-image-report-${{ matrix.slug }}
          path: |
            trivy-results-${{ matrix.slug }}.txt
            trivy-results-${{ matrix.slug }}.sarif
          if-no-files-found: warn
          retention-days: 14

      - name: Publish Trivy job summary
        if: always()
        env:
          IMAGE_REF: ${{ env.IMAGE_NAME }}:scan-${{ matrix.slug }}
          PLATFORM: ${{ matrix.platform }}
          REPORT_FILE: trivy-results-${{ matrix.slug }}.txt
        shell: bash
        run: |
          {
            echo "## Trivy image scan"
            echo
            echo "- Image: \`$IMAGE_REF\`"
            echo "- Platform: \`$PLATFORM\`"
            echo "- Severities: \`CRITICAL,HIGH\`"
            echo "- Unfixed vulnerabilities: ignored"
            echo
            if [[ -s "$REPORT_FILE" ]]; then
              total_lines="$(wc -l < "$REPORT_FILE")"
              echo '```text'
              sed -n '1,200p' "$REPORT_FILE"
              echo '```'
              if (( total_lines > 200 )); then
                echo
                echo "Report truncated to 200 lines. Download the platform artifact for the complete output."
              fi
            else
              echo "Trivy did not generate the readable report. Review the scan step logs."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run scanned image
        env:
          IMAGE_REF: ${{ env.IMAGE_NAME }}:scan-${{ matrix.slug }}
          PLATFORM: ${{ matrix.platform }}
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --platform "$PLATFORM" \
            --entrypoint /opt/vectis/bin/vectis \
            "$IMAGE_REF" \
            version

  publish-image:
    name: Publish and verify image
    if: ${{ needs.metadata.outputs.publish == 'true' }}
    needs: metadata
    runs-on: ubuntu-latest
    timeout-minutes: 360
    environment: Release
    permissions:
      contents: read
      id-token: write
      attestations: write
      security-events: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push AMD64 candidate by digest
        id: build_amd64
        continue-on-error: true
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: image/Dockerfile.tag
          build-args: |
            VECTIS_BUILD_COMMIT=${{ github.sha }}
          platforms: linux/amd64
          provenance: false
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=release-image-amd64
          cache-to: type=gha,mode=max,scope=release-image-amd64
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.metadata.outputs.tag }}

      - name: Prepare amd64 SBOM subject
        id: sbom_subject_amd64
        if: ${{ steps.build_amd64.outcome == 'success' }}
        continue-on-error: true
        env:
          IMAGE_REF: ${{ env.IMAGE_NAME }}@${{ steps.build_amd64.outputs.digest }}
          IMAGE_SOURCE: remote
          PLATFORM: linux/amd64
          SLUG: amd64
          SBOM_BASE: .ci/sbom/amd64/vectis-image-amd64
          SBOM_REPORT: .ci/sbom/amd64/inventory.json
        shell: bash
        run: *prepare-image-sbom

      - name: Inventory amd64 SBOM subject
        id: sbom_scan_amd64
        if: ${{ steps.sbom_subject_amd64.outcome == 'success' }}
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_IGNOREFILE: .ci/sbom/amd64/empty.trivyignore
          TRIVY_IMAGE_SRC: remote
        with:
          version: v0.70.0
          image-ref: ${{ env.IMAGE_NAME }}@${{ steps.build_amd64.outputs.digest }}
          scanners: vuln
          format: json
          output: .ci/sbom/amd64/inventory.json
          list-all-pkgs: "true"
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "0"

      - name: Convert and validate amd64 image SBOM
        id: sbom_amd64
        if: ${{ steps.sbom_scan_amd64.outcome == 'success' }}
        continue-on-error: true
        env:
          IMAGE_REF: ${{ env.IMAGE_NAME }}@${{ steps.build_amd64.outputs.digest }}
          IMAGE_SOURCE: remote
          PLATFORM: linux/amd64
          SLUG: amd64
          SBOM_BASE: .ci/sbom/amd64/vectis-image-amd64
          SBOM_REPORT: .ci/sbom/amd64/inventory.json
        shell: bash
        run: *complete-image-sbom

      - name: Generate readable AMD64 Trivy report
        id: report_amd64
        if: ${{ steps.build_amd64.outcome == 'success' }}
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.70.0
          image-ref: ${{ env.IMAGE_NAME }}@${{ steps.build_amd64.outputs.digest }}
          format: table
          output: trivy-results-amd64.txt
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"

      - name: Run AMD64 Trivy security gate
        id: gate_amd64
        if: ${{ steps.build_amd64.outcome == 'success' }}
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.70.0
          image-ref: ${{ env.IMAGE_NAME }}@${{ steps.build_amd64.outputs.digest }}
          format: sarif
          output: trivy-results-amd64.sarif
          severity: CRITICAL,HIGH
          limit-severities-for-sarif: true
          ignore-unfixed: true
          exit-code: "1"

      - name: Build and push ARM64 candidate by digest
        id: build_arm64
        continue-on-error: true
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: image/Dockerfile.tag
          build-args: |
            VECTIS_BUILD_COMMIT=${{ github.sha }}
          platforms: linux/arm64
          provenance: false
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=release-image-arm64
          cache-to: type=gha,mode=max,scope=release-image-arm64
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.metadata.outputs.tag }}

      - name: Prepare arm64 SBOM subject
        id: sbom_subject_arm64
        if: ${{ steps.build_arm64.outcome == 'success' }}
        continue-on-error: true
        env:
          IMAGE_REF: ${{ env.IMAGE_NAME }}@${{ steps.build_arm64.outputs.digest }}
          IMAGE_SOURCE: remote
          PLATFORM: linux/arm64
          SLUG: arm64
          SBOM_BASE: .ci/sbom/arm64/vectis-image-arm64
          SBOM_REPORT: .ci/sbom/arm64/inventory.json
        shell: bash
        run: *prepare-image-sbom

      - name: Inventory arm64 SBOM subject
        id: sbom_scan_arm64
        if: ${{ steps.sbom_subject_arm64.outcome == 'success' }}
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_IGNOREFILE: .ci/sbom/arm64/empty.trivyignore
          TRIVY_IMAGE_SRC: remote
        with:
          version: v0.70.0
          image-ref: ${{ env.IMAGE_NAME }}@${{ steps.build_arm64.outputs.digest }}
          scanners: vuln
          format: json
          output: .ci/sbom/arm64/inventory.json
          list-all-pkgs: "true"
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "0"

      - name: Convert and validate arm64 image SBOM
        id: sbom_arm64
        if: ${{ steps.sbom_scan_arm64.outcome == 'success' }}
        continue-on-error: true
        env:
          IMAGE_REF: ${{ env.IMAGE_NAME }}@${{ steps.build_arm64.outputs.digest }}
          IMAGE_SOURCE: remote
          PLATFORM: linux/arm64
          SLUG: arm64
          SBOM_BASE: .ci/sbom/arm64/vectis-image-arm64
          SBOM_REPORT: .ci/sbom/arm64/inventory.json
        shell: bash
        run: *complete-image-sbom

      - name: Generate readable ARM64 Trivy report
        id: report_arm64
        if: ${{ steps.build_arm64.outcome == 'success' }}
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.70.0
          image-ref: ${{ env.IMAGE_NAME }}@${{ steps.build_arm64.outputs.digest }}
          format: table
          output: trivy-results-arm64.txt
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"

      - name: Run ARM64 Trivy security gate
        id: gate_arm64
        if: ${{ steps.build_arm64.outcome == 'success' }}
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.70.0
          image-ref: ${{ env.IMAGE_NAME }}@${{ steps.build_arm64.outputs.digest }}
          format: sarif
          output: trivy-results-arm64.sarif
          severity: CRITICAL,HIGH
          limit-severities-for-sarif: true
          ignore-unfixed: true
          exit-code: "1"

      - name: Preserve image SBOM evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          include-hidden-files: true
          name: sbom-image-candidates
          path: |
            .ci/sbom/**/inventory.json*
            .ci/sbom/**/*.cdx.json
            .ci/sbom/**/*.spdx.json
            .ci/sbom/**/*build-info.json
            .ci/sbom/**/*.subject.json
            .ci/sbom/**/*.verified.json
          if-no-files-found: warn
          retention-days: 30

      - name: Upload AMD64 Trivy SARIF
        id: upload_sarif_amd64
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          sarif_file: trivy-results-amd64.sarif
          category: trivy-image

      - name: Upload ARM64 Trivy SARIF
        id: upload_sarif_arm64
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          sarif_file: trivy-results-arm64.sarif
          category: trivy-image-arm64

      - name: Upload Trivy reports
        id: upload_reports
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-image-report
          path: |
            trivy-results-amd64.txt
            trivy-results-amd64.sarif
            trivy-results-arm64.txt
            trivy-results-arm64.sarif
          if-no-files-found: warn
          retention-days: 14

      - name: Publish Trivy job summary
        if: always()
        env:
          AMD64_REF: ${{ env.IMAGE_NAME }}@${{ steps.build_amd64.outputs.digest }}
          ARM64_REF: ${{ env.IMAGE_NAME }}@${{ steps.build_arm64.outputs.digest }}
        shell: bash
        run: |
          render_report() {
            local platform="$1"
            local image_ref="$2"
            local report_file="$3"

            echo "### $platform"
            echo
            echo "- Image: \`$image_ref\`"
            echo "- Severities: \`CRITICAL,HIGH\`"
            echo "- Unfixed vulnerabilities: ignored"
            echo

            if [[ -s "$report_file" ]]; then
              local total_lines
              total_lines="$(wc -l < "$report_file")"
              echo '```text'
              sed -n '1,200p' "$report_file"
              echo '```'
              if (( total_lines > 200 )); then
                echo
                echo "Report truncated to 200 lines. Download the artifact for the complete output."
              fi
            else
              echo "Trivy did not generate this report. Review the scan step logs."
            fi
            echo
          }

          {
            echo "## Trivy image scans"
            echo
            render_report "linux/amd64" "$AMD64_REF" "trivy-results-amd64.txt"
            render_report "linux/arm64" "$ARM64_REF" "trivy-results-arm64.txt"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Validate candidate builds and reports
        if: always()
        env:
          BUILD_AMD64: ${{ steps.build_amd64.outcome }}
          REPORT_AMD64: ${{ steps.report_amd64.outcome }}
          GATE_AMD64: ${{ steps.gate_amd64.outcome }}
          SARIF_AMD64: ${{ steps.upload_sarif_amd64.outcome }}
          BUILD_ARM64: ${{ steps.build_arm64.outcome }}
          REPORT_ARM64: ${{ steps.report_arm64.outcome }}
          GATE_ARM64: ${{ steps.gate_arm64.outcome }}
          SARIF_ARM64: ${{ steps.upload_sarif_arm64.outcome }}
          REPORT_UPLOAD: ${{ steps.upload_reports.outcome }}
          SBOM_AMD64: ${{ steps.sbom_amd64.outcome }}
          SBOM_ARM64: ${{ steps.sbom_arm64.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          failed=0

          check_outcome() {
            local name="$1"
            local outcome="$2"
            if [[ "$outcome" != "success" ]]; then
              echo "::error::$name outcome was $outcome"
              failed=1
            fi
          }

          check_outcome "AMD64 build" "$BUILD_AMD64"
          check_outcome "AMD64 readable report" "$REPORT_AMD64"
          check_outcome "AMD64 security gate" "$GATE_AMD64"
          check_outcome "AMD64 SARIF upload" "$SARIF_AMD64"
          check_outcome "ARM64 build" "$BUILD_ARM64"
          check_outcome "ARM64 readable report" "$REPORT_ARM64"
          check_outcome "ARM64 security gate" "$GATE_ARM64"
          check_outcome "ARM64 SARIF upload" "$SARIF_ARM64"
          check_outcome "Trivy artifact upload" "$REPORT_UPLOAD"
          check_outcome "AMD64 SBOM" "$SBOM_AMD64"
          check_outcome "ARM64 SBOM" "$SBOM_ARM64"

          for report in \
            trivy-results-amd64.txt \
            trivy-results-amd64.sarif \
            trivy-results-arm64.txt \
            trivy-results-arm64.sarif
          do
            if [[ ! -s "$report" ]]; then
              echo "::error::Missing or empty report: $report"
              failed=1
            fi
          done

          exit "$failed"

      - name: Smoke test AMD64 candidate
        id: smoke_amd64
        continue-on-error: true
        env:
          IMAGE_DIGEST: ${{ steps.build_amd64.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --platform linux/amd64 \
            --entrypoint /opt/vectis/bin/vectis \
            "$IMAGE_NAME@$IMAGE_DIGEST" \
            version

      - name: Smoke test ARM64 candidate
        id: smoke_arm64
        continue-on-error: true
        env:
          IMAGE_DIGEST: ${{ steps.build_arm64.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --platform linux/arm64 \
            --entrypoint /opt/vectis/bin/vectis \
            "$IMAGE_NAME@$IMAGE_DIGEST" \
            version

      - name: Validate candidate smoke tests
        env:
          SMOKE_AMD64: ${{ steps.smoke_amd64.outcome }}
          SMOKE_ARM64: ${{ steps.smoke_arm64.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SMOKE_AMD64" == "success" ]] || {
            echo "::error::AMD64 smoke test outcome was $SMOKE_AMD64"
            exit 1
          }
          [[ "$SMOKE_ARM64" == "success" ]] || {
            echo "::error::ARM64 smoke test outcome was $SMOKE_ARM64"
            exit 1
          }

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      - name: Attest and verify candidate SBOMs
        env:
          AMD64_DIGEST: ${{ steps.build_amd64.outputs.digest }}
          ARM64_DIGEST: ${{ steps.build_arm64.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release-image.yml@${GITHUB_REF}"
          for slug in amd64 arm64; do
            if [[ "$slug" == amd64 ]]; then digest="$AMD64_DIGEST"; else digest="$ARM64_DIGEST"; fi
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            base=".ci/sbom/$slug/vectis-image-$slug"
            for format in cdx spdx; do
              if [[ "$format" == cdx ]]; then type=cyclonedx; else type=spdxjson; fi
              cosign attest --yes --type "$type" --predicate "$base.$format.json" "$IMAGE_NAME@$digest"
              cosign verify-attestation --type "$type" \
                --certificate-identity "$identity" \
                --certificate-oidc-issuer https://token.actions.githubusercontent.com \
                "$IMAGE_NAME@$digest" > "$base.$format.verified.json"
              jq -s -e --arg hash "${digest#sha256:}" --slurpfile expected "$base.$format.json" '
                flatten | any(.[]; (.payload | @base64d | fromjson) |
                  any(.subject[]; .digest.sha256 == $hash) and .predicate == $expected[0])
              ' "$base.$format.verified.json" > /dev/null
            done
          done

      - name: Promote verified digests to resolved tag
        id: promote
        env:
          AMD64_DIGEST: ${{ steps.build_amd64.outputs.digest }}
          ARM64_DIGEST: ${{ steps.build_arm64.outputs.digest }}
          IMAGE_REF: ${{ needs.metadata.outputs.image_ref }}
        shell: bash
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            --tag "$IMAGE_REF" \
            --metadata-file manifest-metadata.json \
            "$IMAGE_NAME@$AMD64_DIGEST" \
            "$IMAGE_NAME@$ARM64_DIGEST"

          manifest_digest="$(
            jq -er '.["containerimage.descriptor"].digest' manifest-metadata.json
          )"
          [[ "$manifest_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "digest=$manifest_digest" >> "$GITHUB_OUTPUT"

      - name: Verify published manifest
        env:
          AMD64_DIGEST: ${{ steps.build_amd64.outputs.digest }}
          ARM64_DIGEST: ${{ steps.build_arm64.outputs.digest }}
          IMAGE_REF: ${{ needs.metadata.outputs.image_ref }}
          MANIFEST_DIGEST: ${{ steps.promote.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          tag_digest="$(
            docker buildx imagetools inspect "$IMAGE_REF" \
              | awk '$1 == "Digest:" { print $2; exit }'
          )"
          [[ "$tag_digest" == "$MANIFEST_DIGEST" ]]

          manifest_json="$(mktemp)"
          trap 'rm -f "$manifest_json"' EXIT
          docker buildx imagetools inspect --raw "$IMAGE_REF" > "$manifest_json"
          jq -e \
            --arg amd64 "$AMD64_DIGEST" \
            --arg arm64 "$ARM64_DIGEST" \
            '
              [
                .manifests[]
                | {
                    digest,
                    os: .platform.os,
                    architecture: .platform.architecture
                  }
              ] as $manifests
              | ($manifests | length == 2)
                and (
                  $manifests
                  | any(
                      .digest == $amd64
                      and .os == "linux"
                      and .architecture == "amd64"
                    )
                )
                and (
                  $manifests
                  | any(
                      .digest == $arm64
                      and .os == "linux"
                      and .architecture == "arm64"
                    )
                )
            ' "$manifest_json" >/dev/null

      - name: Attest published image provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.promote.outputs.digest }}
          push-to-registry: true

      - name: Preserve image SBOM evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          include-hidden-files: true
          name: sbom-image-attestations
          path: |
            .ci/sbom/**/inventory.json*
            .ci/sbom/**/*.cdx.json
            .ci/sbom/**/*.spdx.json
            .ci/sbom/**/*build-info.json
            .ci/sbom/**/*.subject.json
            .ci/sbom/**/*.verified.json
          if-no-files-found: warn
          retention-days: 30
