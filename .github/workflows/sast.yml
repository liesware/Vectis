name: SAST

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

permissions: {}

jobs:
  codeql:
    if: >-
      github.event_name != 'pull_request' || github.base_ref == 'main'
    name: Analyze ${{ matrix.language }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        language:
          - actions
          - rust

    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - name: Analyze
        uses: github/codeql-action/analyze@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          category: "/language:${{ matrix.language }}"

  semgrep:
    if: >-
      github.event_name != 'pull_request' || github.base_ref == 'main'
    name: semgrep-ce/scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    permissions:
      contents: read
      security-events: write

    concurrency:
      group: semgrep-ce-${{ github.event_name }}-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Log in to Docker Hub
        # Optional: define DOCKERHUB_USERNAME/DOCKERHUB_TOKEN repo secrets to lift
        # Docker Hub's anonymous pull-rate limit. Without them this is a no-op and
        # the image is pulled anonymously, as before.
        if: env.DOCKERHUB_TOKEN != ''
        shell: bash
        run: printf '%s' "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin

      - name: Restore cached Semgrep ruleset
        id: ruleset-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/semgrep-ruleset
          key: semgrep-ruleset-${{ github.run_id }}
          restore-keys: |
            semgrep-ruleset-

      - name: Refresh Semgrep ruleset
        id: ruleset
        shell: bash
        run: |
          set -uo pipefail
          dir="$HOME/.cache/semgrep-ruleset"
          mkdir -p "$dir"
          target="$dir/ruleset.yml"
          tmp="$(mktemp)"

          # Always try to download the current ruleset first, then cache it.
          if curl -fsSL --retry 3 --retry-delay 2 --max-time 120 \
               -A "semgrep-ce-ci" \
               -o "$tmp" "https://semgrep.dev/c/p/default" \
             && [ -s "$tmp" ] \
             && head -n1 "$tmp" | grep -q '^rules:'; then
            mv "$tmp" "$target"
            chmod a+r "$target"
            echo "source=fresh" >>"$GITHUB_OUTPUT"
            echo "Downloaded fresh ruleset ($(wc -c <"$target") bytes)."
          else
            # Download failed: fall back to the previously downloaded ruleset.
            rm -f "$tmp"
            if [ -s "$target" ]; then
              echo "source=cache" >>"$GITHUB_OUTPUT"
              echo "Ruleset download failed; using the previously cached ruleset."
            else
              echo "source=none" >>"$GITHUB_OUTPUT"
              echo "Ruleset download failed and no cached ruleset is available." >&2
              exit 2
            fi
          fi

      - name: Save Semgrep ruleset to cache
        if: always() && steps.ruleset.outputs.source == 'fresh'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/semgrep-ruleset
          key: semgrep-ruleset-${{ github.run_id }}

      - name: Run Semgrep CE
        id: semgrep
        shell: bash
        run: |
          report="$(mktemp)"
          set +e
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/src:ro" \
            --volume "$HOME/.cache/semgrep-ruleset:/rules:ro" \
            --workdir /src \
            --entrypoint semgrep \
            semgrep/semgrep:1.172.0-nonroot@sha256:d1012a3bf2acf47721216fbf7ff12d4c2971cc7f9c7b77cf6c6e9dcf006bd487 \
            scan --config /rules/ruleset.yml --metrics off --sarif --quiet . >"$report"
          status=$?
          set -e

          if jq -e . "$report" >/dev/null 2>&1; then
            mv "$report" semgrep.sarif
          else
            rm -f "$report"
          fi

          # Surface the exit code instead of propagating it: 0 = completed, 1 = findings
          # (both mean the scan ran), >=2 = real error. The enforce step decides.
          echo "status=$status" >>"$GITHUB_OUTPUT"

      - name: Upload SARIF report
        # Fork PRs get a read-only GITHUB_TOKEN, so code-scanning upload would 403.
        # Skip it there; the scan still runs and the SARIF is kept as an artifact.
        if: always() && hashFiles('semgrep.sarif') != '' && github.event.pull_request.head.repo.fork != true
        uses: github/codeql-action/upload-sarif@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          sarif_file: semgrep.sarif
          category: semgrep-ce

      - name: Upload report artifact
        if: always() && hashFiles('semgrep.sarif') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: semgrep-ce-report
          path: semgrep.sarif
          retention-days: 14
          if-no-files-found: warn

      - name: Write job summary
        if: always()
        env:
          RULESET_SOURCE: ${{ steps.ruleset.outputs.source }}
          SCAN_STATUS: ${{ steps.semgrep.outputs.status }}
        shell: bash
        run: |
          {
            echo "## Semgrep CE"
            echo
            echo "- Engine: 1.172.0"
            echo "- Rules: p/default ($RULESET_SOURCE)"
            echo "- Scan exit code: $SCAN_STATUS (0 completed under report-only, 1 findings, >=2 error)"
            echo "- Findings: Security > Code scanning"
            echo "- Full report: semgrep-ce-report artifact"
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Enforce successful scan
        # Fail only on a real scan error (exit >=2). Exit 0 (completed) and 1 (findings)
        # both mean the scan completed; findings are triaged via code scanning.
        if: steps.semgrep.outputs.status != '0' && steps.semgrep.outputs.status != '1'
        env:
          SCAN_STATUS: ${{ steps.semgrep.outputs.status }}
        shell: bash
        run: |
          echo "Semgrep did not complete (exit $SCAN_STATUS)." >&2
          exit 1

  gitleaks:
    if: >-
      github.event_name != 'pull_request' || github.base_ref == 'main'
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read
      security-events: write

    concurrency:
      group: gitleaks-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        id: gitleaks-scan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_SUMMARY: "true"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "true"

      - name: Upload Gitleaks SARIF
        if: >-
          always() && hashFiles('results.sarif') != '' &&
          github.event.pull_request.head.repo.fork != true &&
          github.actor != 'dependabot[bot]' &&
          github.event.pull_request.user.login != 'dependabot[bot]'
        uses: github/codeql-action/upload-sarif@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          sarif_file: results.sarif
          category: gitleaks
          wait-for-processing: true

  zizmor:
    if: >-
      github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write
      contents: read

    concurrency:
      group: zizmor-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          version: v1.29.0
          # Fork PRs get a read-only GITHUB_TOKEN, so the code-scanning upload
          # would 403. There zizmor prints findings to the console and fails the
          # job on findings instead; same-repo runs still upload to code scanning.
          advanced-security: ${{ github.event.pull_request.head.repo.fork != true }}
