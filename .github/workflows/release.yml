name: Release Binaries

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  metadata:
    name: Validate release metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      release_tag: ${{ steps.metadata.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Read release metadata
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          version="$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "vectis") | .version')"
          test -n "$version"
          test "$version" != "null"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release_tag=v$version" >> "$GITHUB_OUTPUT"

          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            test "$GITHUB_REF_TYPE" = "tag"
            test "$GITHUB_REF_NAME" = "v$version"
          fi

  build-binary:
    name: Build ${{ matrix.archive }}
    needs: metadata
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            archive: vectis-linux-amd64
          - runner: ubuntu-24.04-arm
            archive: vectis-linux-arm64
          - runner: macos-14
            archive: vectis-macos-arm64
    env:
      CARGO_TERM_COLOR: always
      RELEASE_TAG: ${{ needs.metadata.outputs.release_tag }}

    steps:
      - uses: actions/checkout@v4

      - name: Build release binary
        run: cargo build --release --locked

      - name: Package binary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          tar -C target/release -czf "dist/${{ matrix.archive }}-${RELEASE_TAG}.tar.gz" vectis

      - name: Attest binary provenance
        uses: actions/attest@v4
        with:
          subject-path: dist/${{ matrix.archive }}-${{ env.RELEASE_TAG }}.tar.gz

      - name: Upload release asset
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.archive }}
          path: dist/${{ matrix.archive }}-${{ env.RELEASE_TAG }}.tar.gz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub release
    needs: [metadata, build-binary]
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.metadata.outputs.release_tag }}

    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          (
            cd dist
            sha256sum *.tar.gz > SHA256SUMS
          )

      - name: Create GitHub release
        shell: bash
        run: |
          gh release create "$RELEASE_TAG" \
            dist/*.tar.gz \
            dist/SHA256SUMS \
            --title "Vectis $RELEASE_TAG" \
            --generate-notes
