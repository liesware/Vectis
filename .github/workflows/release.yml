name: Release Binaries

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-binaries-${{ github.ref }}
  cancel-in-progress: false

jobs:
  metadata:
    name: Validate release metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      release_tag: ${{ steps.metadata.outputs.release_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Read release metadata
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          version="$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "vectis") | .version')"
          test -n "$version"
          test "$version" != "null"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release_tag=v$version" >> "$GITHUB_OUTPUT"

          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            test "$GITHUB_REF_TYPE" = "tag"
            test "$GITHUB_REF_NAME" = "v$version"
          fi

  build-binary:
    name: Build ${{ matrix.archive }}
    needs: metadata
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            archive: vectis-linux-amd64
          - runner: ubuntu-24.04-arm
            archive: vectis-linux-arm64
          - runner: macos-14
            archive: vectis-macos-arm64
    env:
      CARGO_TERM_COLOR: always
      RELEASE_TAG: ${{ needs.metadata.outputs.release_tag }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Build release binary
        run: cargo build --release --locked

      - name: Package binary
        shell: bash
        run: |
          set -euo pipefail
          package_dir="${{ matrix.archive }}-${RELEASE_TAG}"
          asset="${package_dir}.tar.gz"
          mkdir -p dist
          mkdir "dist/${package_dir}"
          install -m 755 target/release/vectis "dist/${package_dir}/vectis"
          cp LICENSE NOTICE README.md SECURITY.md "dist/${package_dir}/"
          tar -C dist -czf "dist/${asset}" "$package_dir"

      - name: Verify release package contents
        shell: bash
        run: |
          set -euo pipefail
          package_dir="${{ matrix.archive }}-${RELEASE_TAG}"
          asset="dist/${package_dir}.tar.gz"
          expected="$(mktemp)"
          actual="$(mktemp)"
          trap 'rm -f "$expected" "$actual"' EXIT

          {
            printf '%s/\n' "$package_dir"
            for file in vectis LICENSE NOTICE README.md SECURITY.md; do
              printf '%s/%s\n' "$package_dir" "$file"
            done
          } | LC_ALL=C sort > "$expected"
          tar -tzf "$asset" | LC_ALL=C sort > "$actual"
          diff -u "$expected" "$actual"

      - name: Attest binary provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4
        with:
          subject-path: dist/${{ matrix.archive }}-${{ env.RELEASE_TAG }}.tar.gz

      - name: Upload release asset
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ matrix.archive }}
          path: dist/${{ matrix.archive }}-${{ env.RELEASE_TAG }}.tar.gz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub release
    needs: [metadata, build-binary]
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.metadata.outputs.release_tag }}

    steps:
      - name: Download release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          (
            cd dist
            sha256sum *.tar.gz > SHA256SUMS
          )

      - name: Create GitHub release
        shell: bash
        run: |
          gh release create "$RELEASE_TAG" \
            dist/*.tar.gz \
            dist/SHA256SUMS \
            --title "Vectis $RELEASE_TAG" \
            --generate-notes
